<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>A Garden Full of Reasons I Love You</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Quicksand:wght@500;600&display=swap">
<style>
/* ==========================================================================
   A Garden Full of Reasons I Love You
   Layout concept: one dreamy full-bleed garden. Everything else floats above it
   as frosted-cream glass: counter, message cards, the letter.
   The sky slowly turns from pastel morning to lavender dusk as flowers are collected (--p).
   ========================================================================== */

:root {
  /* palette: soft pink, cream, white and pastel purple */
  --cream: #fff8f1;
  --blush: #ffe3ec;
  --petal: #ffb6cf;
  --rose: #e8578f;
  --rose-deep: #b8386f;
  --lilac: #cdb8f0;
  --lilac-deep: #7d5fb5;
  --plum: #54345c;
  --plum-soft: #7a5a84;
  --gold: #ffd98a;
  --glass: rgba(255, 250, 246, .86);
  --glass-line: rgba(255, 255, 255, .85);

  /* type: script for love notes, serif for the words that matter, rounded sans for small UI */
  --font-script: 'Great Vibes', 'Snell Roundhand', 'Apple Chancery', cursive;
  --font-serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Quicksand', ui-rounded, 'Avenir Next', system-ui, sans-serif;

  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --fw: clamp(88px, min(31vw, 23vh), 210px);   /* width of a flower at scale 1 */
  --p: 0;                                       /* garden progress 0..1, set by game.js */
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden; background: var(--cream); color: var(--plum);
  font-family: var(--font-ui); overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--lilac-deep); outline-offset: 3px; border-radius: 14px; }

.glass {
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.25); backdrop-filter: blur(14px) saturate(1.25);
  box-shadow: 0 12px 40px rgba(176, 90, 150, .22), inset 0 1px 0 rgba(255, 255, 255, .8);
}

[hidden] { display: none !important; }
#veil { position: fixed; inset: 0; z-index: 200; background: var(--cream); opacity: 0; pointer-events: none; transition: opacity .9s ease; }
#veil.on { opacity: 1; pointer-events: auto; }

/* ==========================================================================
   Sky, hills, meadow
   ========================================================================== */
#sky { position: fixed; inset: 0; overflow: hidden; }
.sky-day, .sky-dusk { position: absolute; inset: 0; }
.sky-day  { background: linear-gradient(180deg, #f5d1ea 0%, #ffe3ee 34%, #fff0e8 62%, #ffebcf 100%); }
.sky-dusk { background: linear-gradient(180deg, #a995dd 0%, #d9a9dc 34%, #ffbfca 66%, #ffe0b8 100%); opacity: var(--p); transition: opacity 2.4s ease; }
.stars { position: absolute; inset: 0 0 38% 0; opacity: calc(var(--p) * 1.15); transition: opacity 2.4s ease; }
.star { position: absolute; width: var(--z); height: var(--z); border-radius: 50%; background: #fff; box-shadow: 0 0 6px 1px rgba(255, 255, 255, .9); animation: twinkle var(--t) ease-in-out var(--d) infinite; }

.clouds { position: absolute; inset: 0; pointer-events: none; }
.cloud {
  position: absolute; top: var(--top); left: 0; width: var(--w); aspect-ratio: 200 / 80; opacity: .92;
  animation: drift var(--dur) linear var(--delay) infinite; will-change: transform; pointer-events: none;
}
.cloud svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 10px rgba(200, 140, 190, .25)); }
button.cloud { pointer-events: auto; cursor: pointer; }

.sun {
  position: absolute; right: 9%; top: 6%; width: min(30vw, 150px); aspect-ratio: 1; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: radial-gradient(circle, #fffef6 0 24%, #fff4bf 38%, rgba(255, 240, 175, .6) 52%, rgba(255, 240, 175, 0) 70%);
  transform: translateY(calc(var(--p) * 24vh)); transition: transform 2.6s ease; animation: sunPulse 6s ease-in-out infinite;
}

#hills { position: fixed; inset: 0; pointer-events: none; }
.hill { position: absolute; left: 0; width: 100%; display: block; }
.hill.far  { bottom: 0; height: 64%; }
.hill.mid  { bottom: 0; height: 52%; }
.hill.near { bottom: 0; height: 40%; }
#tint { position: fixed; inset: 0; pointer-events: none; background: #d9c8f6; mix-blend-mode: multiply; opacity: calc(var(--p) * .72); transition: opacity 2.4s ease; }
#meadow { position: fixed; left: 0; right: 0; bottom: 0; height: 36%; pointer-events: none; }
.dot { position: absolute; width: var(--z); height: var(--z); border-radius: 50%; background: radial-gradient(circle, #ffd86b 0 24%, var(--c) 26% 100%); opacity: .9; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fx-bg { z-index: 8; }
#fx-fg { z-index: 70; }

/* ==========================================================================
   Plants
   ========================================================================== */
/* absolute (not fixed): a fixed layer would trap its plants in their own stacking context, below the scrim */
#stage { position: absolute; top: 0; bottom: 0; left: max(0px, calc(50% - 560px)); right: max(0px, calc(50% - 560px)); overflow: hidden; pointer-events: none; }   /* on wide screens the garden stays a cosy 1120px */
.plant {
  position: absolute; left: var(--x); top: var(--y); width: calc(var(--fw) * var(--s)); aspect-ratio: 200 / 330;
  translate: -50% -100%; transform-origin: 50% 100%; pointer-events: none;
  transition: transform .95s var(--ease-spring); outline-offset: 6px;
}
.plant-svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.plant .hit { fill: none; pointer-events: none; cursor: pointer; }
.plant.ready .hit { pointer-events: all; }
.plant.ready { cursor: pointer; }
.plant .grow, .plant .sway { width: 100%; height: 100%; transform-origin: 50% 100%; }
.plant .sway { animation: sway var(--sw, 6s) ease-in-out var(--sd, 0s) infinite alternate; }
.plant.spot { z-index: 60 !important; }
.plant.spot .sway { animation: none !important; }
.plant.spot .hint { display: none; }
.plant .ground { transition: opacity .5s; }
.plant.spot .ground { opacity: 0; }

#stage .plant .grow { transform: scale(0); opacity: 0; }
body.planted #stage .plant:not([data-id=heart]) .grow, #stage .plant.sprout .grow {
  animation: growIn 1.3s var(--ease-spring) var(--gd, 0s) both;
}
#stage .plant[data-id=heart].sprout .grow { animation-duration: 2.2s; }
#stage .plant.grown .grow { animation: none !important; transform: none; opacity: 1; }

/* the bloom: every petal is a .p group moving from its "bud" pose to its "open" pose */
.p {
  transform: rotate(var(--rc)) scale(var(--cx), var(--cy));
  transition: transform var(--dur, 1.2s) var(--ease, cubic-bezier(.34, 1.56, .64, 1)) var(--d, 0s);
}
.plant.open .p { transform: rotate(var(--ro)) scale(var(--sx), var(--sy)); }
.plant[data-id=rose]      { --ease: cubic-bezier(.22, 1.15, .36, 1); --dur: 1.6s; }
.plant[data-id=tulip]     { --ease: cubic-bezier(.3, 1.75, .5, 1);   --dur: 1.1s; }
.plant[data-id=cherry]    { --ease: cubic-bezier(.3, 1.9, .5, 1);    --dur: .9s; }
.plant[data-id=sunflower] { --ease: cubic-bezier(.2, .9, .3, 1);     --dur: 1.7s; }
.plant[data-id=lavender]  { --ease: cubic-bezier(.34, 1.5, .64, 1);  --dur: .8s; }
.plant[data-id=hibiscus]  { --ease: cubic-bezier(.25, 1.35, .4, 1);  --dur: 1.4s; }
.plant[data-id=peony]     { --ease: cubic-bezier(.2, 2, .45, 1);     --dur: 1s; }
.plant[data-id=heart]     { --ease: cubic-bezier(.3, 1.8, .5, 1);    --dur: 1.3s; }

.plant .glow { opacity: 0; transition: opacity 1s; }
.plant:not(.open) .glow { opacity: .6; animation: glowPulse 2.8s ease-in-out infinite; }
.plant.open .glow { opacity: .55; }
.plant.done .glow, .plant[data-id=heart].open .glow { opacity: .85; animation: glowPulse 3.4s ease-in-out infinite; }
.plant .hint { opacity: 0; }
.plant.ready:not(.open) .hint { animation: hintRing 2.5s ease-out infinite; }
.plant[data-id=heart].ready .hint { animation: hintRing 2s ease-out infinite; }
.plant:not(.open) .bob { animation: budBob 2.8s ease-in-out infinite; }
.plant[data-id=heart].open .bob { animation: heartBeat 1.8s ease-in-out infinite; }
.plant:focus-visible { outline: 3px solid var(--lilac-deep); border-radius: 20px; }

/* after the finale the garden gives its blossoms away, then blooms again */
.plant .sway { transition: opacity 1.6s ease; }
.plant.gave .sway { opacity: 0; }

/* ==========================================================================
   Hidden whispers
   ========================================================================== */
.whisper {
  position: absolute; z-index: 38; width: 50px; height: 50px; translate: -50% -50%; pointer-events: auto; cursor: pointer;
  display: grid; place-items: center; opacity: 0; transition: opacity 1.2s ease 1.2s;
}
body.planted .whisper { opacity: 1; }
body[data-screen=finale] .whisper { opacity: 0; pointer-events: none; transition-delay: 0s; }
.whisper svg { width: 38px; height: 38px; overflow: visible; display: block; filter: drop-shadow(0 3px 5px rgba(120, 60, 120, .28)); }
.whisper::after, .sun::after, button.cloud::after {
  content: '✦'; position: absolute; right: 2px; top: 0; font-size: 12px; line-height: 1; color: #fff;
  text-shadow: 0 0 6px #ffc94d, 0 0 12px #ffc94d; animation: twinkle 2.4s ease-in-out infinite;
}
.sun::after { right: 38%; top: 30%; font-size: 14px; }
button.cloud::after { right: 36%; top: 24%; }
.whisper.found::after, .sun.found::after, button.cloud.found::after { display: none; }
.whisper:active svg { transform: scale(.9); }
.whisper[data-kind=ladybug] { animation: crawl 14s ease-in-out infinite alternate; }
.whisper[data-kind=firefly] svg { animation: hover 4.5s ease-in-out infinite; }
.whisper[data-kind=firefly] .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: buzz .16s linear infinite alternate; }
.whisper[data-kind=butterfly] { animation: flutterPath 17s ease-in-out infinite; }
.whisper[data-kind=butterfly] .wing { transform-box: fill-box; animation: flapWing .32s ease-in-out infinite alternate; }
.whisper[data-kind=butterfly] .wl { transform-origin: 100% 50%; }
.whisper[data-kind=butterfly] .wr { transform-origin: 0% 50%; }
.whisper[data-kind=star] svg { animation: twinkleScale 3s ease-in-out infinite; }
.whisper[data-kind=heart] svg { animation: heartBeat 2.4s ease-in-out infinite; }

/* ==========================================================================
   Welcome screen
   ========================================================================== */
.screen { position: fixed; inset: 0; z-index: 45; }
#welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--safe-t) + 48px) 22px calc(var(--safe-b) + 24vh);
  transition: opacity 1s ease, visibility 0s linear 1s; overflow: hidden;
}
#welcome.leaving { opacity: 0; pointer-events: none; visibility: hidden; }
.welcome-main { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3.2vh, 26px); transition: transform 1s ease, opacity .8s ease; max-width: 640px; }
#welcome.leaving .welcome-main { transform: translateY(-40px) scale(.96); opacity: 0; }
.eyebrow {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .6em; font: 600 clamp(10.5px, 2.9vw, 13.5px)/1.7 var(--font-ui);
  letter-spacing: .32em; text-transform: uppercase; color: var(--rose-deep); max-width: 22em;
}
.eyebrow::before, .eyebrow::after { content: none; }
.hero { font-weight: 400; display: flex; flex-direction: column; align-items: center; gap: 0; }
.hey { font: 400 clamp(2.3rem, 10.5vw, 4rem)/1.05 var(--font-script); color: var(--plum); }
.lola { display: inline-flex; align-items: baseline; justify-content: center; gap: .1em; line-height: .95; }
.lola-name {
  font: 400 clamp(5.6rem, 30vw, 10.5rem)/1.05 var(--font-script); padding: 0 .06em .06em;
  background: linear-gradient(110deg, #d4447f 0%, #a16bd2 45%, #e0568f 70%, #a16bd2 100%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  animation: shimmerText 7s ease-in-out infinite alternate; filter: drop-shadow(0 6px 16px rgba(214, 74, 134, .22));
}
.lola-emoji { font-size: clamp(2rem, 9vw, 3.4rem); animation: hover 3.6s ease-in-out infinite; }
.sub { font: italic 500 clamp(1.2rem, 5vw, 1.65rem)/1.4 var(--font-serif); color: var(--plum-soft); max-width: 18em; text-wrap: balance; }
.made {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: calc(var(--safe-b) + 14px); text-align: center;
  font: italic 500 clamp(1rem, 4vw, 1.2rem)/1.2 var(--font-serif); color: #fff; text-shadow: 0 1px 10px rgba(110, 50, 130, .65);
  transition: opacity .8s;
}
#welcome.leaving .made { opacity: 0; }

.branch { position: absolute; z-index: 1; top: calc(var(--safe-t) - 8px); left: -4px; width: min(86vw, 460px); pointer-events: none; transform-origin: 0 0; animation: branchSway 8s ease-in-out infinite alternate; }
.branch.right { left: auto; right: -4px; top: calc(var(--safe-t) + 70px); width: min(54vw, 300px); transform: scaleX(-1); transform-origin: 50% 0; animation-name: branchSwayR; opacity: .95; }
.branch-svg { width: 100%; display: block; overflow: visible; }
.bl { transform-box: fill-box; transform-origin: 50% 0; animation: blSway 4.5s ease-in-out infinite alternate; }

.welcome-flowers { position: absolute; top: 0; bottom: 0; left: max(0px, calc(50% - 560px)); right: max(0px, calc(50% - 560px)); z-index: 2; pointer-events: none; transition: transform 1.2s ease, opacity 1s ease; }
.welcome-flowers .plant { animation: riseIn 1.8s var(--ease-spring) var(--gd, 0s) both; }
#welcome.leaving .welcome-flowers { transform: translateY(30vh); opacity: 0; }

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 52px; padding: 0 28px; border-radius: 999px; overflow: hidden;
  font: 600 1.02rem/1.2 var(--font-ui); letter-spacing: .02em; color: #fff; text-align: center;
  background: linear-gradient(135deg, #cc3f79 0%, #b0387a 55%, #8a54bd 100%);
  box-shadow: 0 12px 28px rgba(190, 60, 130, .38), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .25s var(--ease-spring), box-shadow .25s;
}
.btn::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: sheen 4.5s ease-in-out 1.5s infinite;
}
.btn:hover { transform: translateY(-2px) scale(1.02); }
.btn:active { transform: scale(.97); }
.btn-big { min-height: 60px; padding: 0 38px; font-size: clamp(1.08rem, 4.4vw, 1.3rem); animation: beat 2.6s ease-in-out 1.4s infinite; }
.btn.ghost { color: var(--plum); background: rgba(255, 255, 255, .72); box-shadow: 0 6px 18px rgba(176, 90, 150, .18), inset 0 0 0 1.5px rgba(184, 56, 111, .22); }
.btn.ghost::after { display: none; }
.btn.answer { width: 100%; min-height: 50px; padding: 10px 20px; font-size: 1rem; }

/* ==========================================================================
   HUD, mute button, hint
   ========================================================================== */
#hud {
  position: fixed; z-index: 62; top: 0; left: 0; padding: calc(var(--safe-t) + 12px) 0 0 calc(var(--safe-l) + 14px); pointer-events: none;
  transform: translateY(-140%); transition: transform .9s var(--ease-spring) .3s;
}
body[data-screen=garden] #hud, body[data-screen=secret] #hud { transform: none; }
.hud-col { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.counter { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 10px; border-radius: 999px; }
.slots { display: flex; gap: 5px; }
.slot { position: relative; width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, .5); box-shadow: inset 0 0 0 1.5px rgba(232, 87, 143, .3); display: grid; place-items: center; }
.slot svg { width: 100%; height: 100%; overflow: visible; }
.slot.filled { background: #fff; box-shadow: 0 0 0 1.5px var(--petal), 0 0 12px rgba(255, 140, 185, .8); animation: slotPop .8s var(--ease-spring); }
.count { font: 600 1rem/1 var(--font-ui); letter-spacing: .05em; font-variant-numeric: tabular-nums; color: var(--rose-deep); }
.count b { display: inline-block; font-size: 1.2em; font-weight: 700; }
.count b.bump { animation: numBump .6s var(--ease-spring); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; font: 600 .8rem/1 var(--font-ui); letter-spacing: .06em; color: var(--lilac-deep); font-variant-numeric: tabular-nums; }
.chip.bump { animation: numBump .6s var(--ease-spring); }

#muteBtn {
  position: fixed; z-index: 101; top: calc(var(--safe-t) + 12px); right: calc(var(--safe-r) + 14px); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--rose-deep);
  transition: transform .25s var(--ease-spring);
}
#muteBtn:active { transform: scale(.9); }
#muteBtn svg { width: 24px; height: 24px; }
#muteBtn[aria-pressed=true] .wave { display: none; }
#muteBtn[aria-pressed=false] .slash { display: none; }
body[data-screen=welcome] #muteBtn:not(.used) { animation: beat 2.8s ease-in-out 2s infinite; }

#hint {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: calc(var(--safe-b) + 18px); text-align: center; padding: 0 20px; pointer-events: none;
  font: italic 500 clamp(1.08rem, 4.4vw, 1.3rem)/1.3 var(--font-serif); color: #fff; text-shadow: 0 1px 12px rgba(110, 50, 130, .75), 0 0 2px rgba(110, 50, 130, .6);
  opacity: 0; transition: opacity .8s;
}
body[data-screen=garden] #hint, body[data-screen=secret] #hint { opacity: 1; }
body.spotlight #hint { opacity: 0 !important; }

/* ==========================================================================
   Scrim, message card, toasts
   ========================================================================== */
#scrim {
  position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .7s ease;
  background: radial-gradient(ellipse at 50% 30%, rgba(255, 238, 248, .5), rgba(142, 96, 186, .46));
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
#scrim.on { opacity: 1; pointer-events: auto; }

.card {
  position: fixed; z-index: 90; left: 50%; bottom: calc(var(--safe-b) + 14px); width: min(calc(100vw - 28px), 480px);
  padding: 22px 22px 20px; border-radius: 30px; text-align: center; background: rgba(255, 251, 248, .95);
  transform: translate(-50%, 130%); opacity: 0; pointer-events: none; visibility: hidden;
  transition: transform .85s var(--ease-spring), opacity .45s ease, visibility 0s linear .85s;
}
.card.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; visibility: visible; transition-delay: 0s; }
.card-icon { width: 46px; height: 46px; margin: -46px auto 6px; filter: drop-shadow(0 6px 10px rgba(180, 70, 130, .3)); }
.card-icon:empty { display: none; }
.card-icon svg { width: 100%; height: 100%; overflow: visible; }
.card-kicker { font: 600 .72rem/1 var(--font-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--rose-deep); margin-bottom: 4px; }
.card-title { font: 400 clamp(2.1rem, 9vw, 2.7rem)/1.15 var(--font-script); color: var(--plum); margin: 8px 0 0; }
.card-title:empty { display: none; }
.card-text { font: italic 500 clamp(1.28rem, 5.3vw, 1.58rem)/1.38 var(--font-serif); color: var(--plum); margin: 10px 0 16px; text-wrap: balance; }
.card-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.card-actions .btn { animation: fadeUp .8s ease backwards; animation-delay: var(--ad, 1.2s); }

.w { display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(4px); animation: wordIn .8s ease forwards; animation-delay: calc(var(--s, 0s) + var(--i) * var(--g, .075s)); white-space: pre-wrap; }

#toast { position: fixed; z-index: 95; left: 50%; top: calc(var(--safe-t) + 112px); translate: -50% 0; width: min(calc(100vw - 28px), 440px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 14px; border-radius: 22px; text-align: left; opacity: 0; transform: translateY(-14px) scale(.96);
  animation: toastIn .6s var(--ease-spring) forwards; font: italic 500 1.12rem/1.32 var(--font-serif); color: var(--plum);
}
.toast.out { animation: toastOut .6s ease forwards; }
.toast .t-ico { flex: none; font-size: 1.5rem; line-height: 1; }

/* ==========================================================================
   Finale: flying flowers, heart bouquet, envelope, closing line
   ========================================================================== */
#finale { position: fixed; inset: 0; z-index: 68; pointer-events: none; display: none; }
#finale.on { display: block; }

    { id: 'butterfly', kind: 'butterfly', x: 70, y: 38, text: 'Every butterfly in this garden is jealous of how easily you make hearts flutter.' },
    { id: 'firefly',   kind: 'firefly',   x: 27, y: 47, text: 'Some people light up a room. You light up my whole day.' },
    { id: 'ladybug',   kind: 'ladybug',   x: 57, y: 79, text: 'They say a ladybug brings good luck. So does knowing you.' },
    { id: 'heart',     kind: 'heart',     x: 36, y: 90, text: 'You found a tiny piece of my heart hiding in the grass. Keep it, it’s yours.' },
    { id: 'letter',    kind: 'envelope',  x: 67, y: 91, text: 'Psst… you’re doing better than you think. And you look lovely doing it.' }

    paragraphs: [

      'There is a kind of beauty that photographs cannot capture, that mirrors cannot explain, and that words will always struggle to describe.',
      'It’s in your smile, your eyes, your laugh, the little things you do without even noticing.',
      'I hope you never look at yourself and forget how special you are.',
      'And if one day you ever doubt your beauty, come back to this little garden and remember that somewhere, there is a boy named Mohamed who sees you as the most beautiful flower in the entire world.',
      'You are my favourite hello, my favourite thought, and one of the sweetest parts of my life.'
    ],
    closing: 'With all my love,',
    signature: 'Mohamed ❤️',

  },

  finale: {
    line1: 'THE GARDEN WILL ALWAYS',

};

<script>
/* art.js
   Every flower, leaf, ribbon and little creature in the garden is drawn with code,
   so there are no image files to load or lose.

   Each flower "head" builder returns SVG markup centred on (0,0).
     S = true   static, fully open markup (used for the bouquet and the counter icons)
     S = false  animated markup: petals carry CSS variables (--ro, --rc, --sx ...) and the
                stylesheet turns them from bud to bloom when the plant gets the .open class. */
const Art = (() => {
  /* template tag that rounds every interpolated number to 1 decimal place */
  const D = (s, ...v) => s.reduce((a, str, i) => a + str + (i < v.length ? (+v[i]).toFixed(1) : ''), '');
  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- petal outlines: base at the origin, tip pointing up (-y) ---------- */
  const shapes = {
    leaf:  (L, W) => D`M0 0C${-W} ${-L * .3} ${-W * .8} ${-L * .9} 0 ${-L}C${W * .8} ${-L * .9} ${W} ${-L * .3} 0 0Z`,
    round: (L, W) => D`M0 0C${-W} ${-L * .12} ${-W * 1.1} ${-L * .95} 0 ${-L}C${W * 1.1} ${-L * .95} ${W} ${-L * .12} 0 0Z`,
    notch: (L, W) => D`M0 0C${-W * .9} ${-L * .25} ${-W * 1.1} ${-L * .85} ${-W * .28} ${-L}Q0 ${-L * .84} ${W * .28} ${-L}C${W * 1.1} ${-L * .85} ${W * .9} ${-L * .25} 0 0Z`,
    cup:   (L, W) => D`M0 0C${-W} ${-L * .1} ${-W * 1.05} ${-L * .7} ${-W * .35} ${-L * .98}Q0 ${-L * 1.1} ${W * .35} ${-L * .98}C${W * 1.05} ${-L * .7} ${W} ${-L * .1} 0 0Z`,
    ruffle:(L, W) => D`M0 0C${-W} ${-L * .12} ${-W * 1.12} ${-L * .8} ${-W * .55} ${-L * .97}Q${-W * .3} ${-L * 1.08} ${-W * .05} ${-L * .98}Q${W * .2} ${-L * 1.09} ${W * .5} ${-L * .97}C${W * 1.12} ${-L * .8} ${W} ${-L * .12} 0 0Z`,
    fan:   (L, W) => D`M0 0C${-W * .5} ${-L * .12} ${-W * 1.15} ${-L * .5} ${-W * .95} ${-L * .8}Q${-W * .6} ${-L * 1.05} ${-W * .15} ${-L * .97}Q${W * .05} ${-L * 1.07} ${W * .3} ${-L * .98}Q${W * .85} ${-L} ${W * .98} ${-L * .78}C${W * 1.15} ${-L * .5} ${W * .5} ${-L * .12} 0 0Z`
  };
  /* a heart, tip at the bottom, roughly S*1.7 wide and tall */
  const heart = S => D`M0 ${.9 * S}C${-.9 * S} ${.25 * S} ${-1.1 * S} ${-.55 * S} ${-.55 * S} ${-.7 * S}C${-.25 * S} ${-.8 * S} 0 ${-.55 * S} 0 ${-.3 * S}C0 ${-.55 * S} ${.25 * S} ${-.8 * S} ${.55 * S} ${-.7 * S}C${1.1 * S} ${-.55 * S} ${.9 * S} ${.25 * S} 0 ${.9 * S}Z`;

  /* ---------- gradients ---------- */
  const lg = (id, stops, vertical = true) =>
    `<linearGradient id="${id}" x1="0" y1="${vertical ? 1 : 0}" x2="${vertical ? 0 : 1}" y2="0">` +
    stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('') + '</linearGradient>';
  const rg = (id, stops, extra = '') =>
    `<radialGradient id="${id}" ${extra}>` + stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('') + '</radialGradient>';

  const defs = () => '<defs>' + [
    lg('g-leaf', [[0, '#67b585'], [1, '#a6dcb7']], false),
    lg('g-stem', [[0, '#5fa87c'], [1, '#8fcfa5']]),
    lg('g-wood', [[0, '#b58a86'], [1, '#d3aaa3']]),
    lg('g-rose-a', [[0, '#c0295b'], [.55, '#ec5a87'], [1, '#ffa3bd']]),
    lg('g-rose-b', [[0, '#b01f52'], [.6, '#e24a7b'], [1, '#ff8fb0']]),
    lg('g-rose-c', [[0, '#8f1745'], [1, '#d6406f']]),
    lg('g-tulip', [[0, '#ff4f8b'], [.6, '#ff7fae'], [1, '#ffc2d8']]),
    lg('g-tulip-d', [[0, '#d63573'], [1, '#ff6b9f']]),
    lg('g-tulip-f', [[0, '#ff6b9f'], [.55, '#ff9cc2'], [1, '#ffe0ec']]),
    lg('g-cherry', [[0, '#ff94bb'], [.55, '#ffd0e1'], [1, '#fff5f9']]),
    lg('g-sun-a', [[0, '#ffae00'], [1, '#ffe680']]),
    lg('g-sun-b', [[0, '#f59300'], [1, '#ffd23f']]),
    rg('g-disc', [[0, '#2f190e'], [.7, '#5a3320'], [1, '#8a5b34']]),
    lg('g-hib', [[0, '#c4175c'], [.45, '#ff4d92'], [1, '#ffaccb']]),
    lg('g-peony-1', [[0, '#ff9dc3'], [1, '#ffe6ef']]),
    lg('g-peony-2', [[0, '#f776a7'], [1, '#ffc6dc']]),
    lg('g-peony-3', [[0, '#ec5b93'], [1, '#ffa6c6']]),
    lg('g-peony-4', [[0, '#dc4584'], [1, '#ff8dba']]),
    lg('g-heart', [[0, '#ff3f84'], [.6, '#ff72a4'], [1, '#ffb2cd']]),
    lg('g-heart-b', [[0, '#ff6ea1'], [1, '#ffc1d6']]),
    lg('g-ribbon', [[0, '#ff6fa3'], [1, '#ffc0d6']], false),
    lg('g-lilac', [[0, '#a78bdf'], [1, '#d9caf6']]),
    rg('g-glow', [[0, 'rgba(255,255,255,.95)'], [.4, 'rgba(255,210,232,.55)'], [1, 'rgba(255,210,232,0)']]),
    rg('g-glow-gold', [[0, 'rgba(255,248,210,.95)'], [.45, 'rgba(255,224,140,.5)'], [1, 'rgba(255,224,140,0)']]),
    rg('g-shadow', [[0, 'rgba(70,120,90,.38)'], [1, 'rgba(70,120,90,0)']])
  ].join('') + '</defs>';

  /* ---------- building blocks ---------- */
  /* wrap markup in a group that animates from "bud" to "open" */
  const grp = (S, inner, o = {}) => {
    const ro = o.ro || 0, sx = o.sx ?? 1, sy = o.sy ?? 1;
    if (S) return `<g transform="rotate(${ro.toFixed(1)}) scale(${sx} ${sy})">${inner}</g>`;
    const rc = o.rc ?? ro * .25, cx = o.cx ?? .3, cy = o.cy ?? .35, d = o.d || 0;
    return `<g class="p" style="--ro:${ro.toFixed(1)}deg;--rc:${rc.toFixed(1)}deg;--sx:${sx};--sy:${sy};--cx:${cx};--cy:${cy};--d:${d.toFixed(2)}s">${inner}</g>`;
  };
  const pet = (S, d, fill, o = {}) =>
    grp(S, `<path d="${d}" fill="${fill}" stroke="${o.stroke || 'rgba(150,40,90,.24)'}" stroke-width="${o.sw || .8}" stroke-linejoin="round"/>`, o);

  const mixHex = (a, b, t) => {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  };

  const leaf = (x, y, rot, L, W) =>
    `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="${shapes.leaf(L, W)}" fill="url(#g-leaf)" stroke="rgba(60,120,80,.22)" stroke-width=".8"/>` +
    `<path d="M0 0L0 ${(-L * .82).toFixed(1)}" stroke="rgba(255,255,255,.5)" stroke-width="1.1" fill="none" stroke-linecap="round"/></g>`;
  const stem = (d, w = 6, grad = 'g-stem') =>
    `<path d="${d}" fill="none" stroke="url(#${grad})" stroke-width="${w}" stroke-linecap="round"/>`;
  const grass = () => [-14, -6, 0, 7, 15].map((dx, i) => leaf(100 + dx, 326, dx * 2.2, 24 + (i % 2) * 10, 4)).join('');

  /* ---------- the flower heads ---------- */
  const heads = {
    rose(S) {
      let s = '<ellipse cx="0" cy="12" rx="21" ry="15" fill="#8fc9a1"/>';
      for (let i = 0; i < 5; i++) s += pet(S, shapes.round(54, 32), 'url(#g-rose-a)', { ro: i * 72, rc: i * 72 - 70, cx: .5, cy: .55, d: i * .05, stroke: 'rgba(140,20,60,.35)' });
      for (let i = 0; i < 5; i++) s += pet(S, shapes.round(44, 28), 'url(#g-rose-b)', { ro: 36 + i * 72, rc: 36 + i * 72 + 60, cx: .5, cy: .55, d: .2 + i * .05, stroke: 'rgba(140,20,60,.35)' });
      for (let i = 0; i < 4; i++) s += pet(S, shapes.round(33, 22), 'url(#g-rose-c)', { ro: 18 + i * 90, rc: 18 + i * 90 - 50, cx: .45, cy: .5, d: .4 + i * .05, stroke: 'rgba(100,10,40,.4)' });
      s += grp(S, '<path d="M-9 0a9 9 0 1 1 18 0a5.5 5.5 0 1 1 -11 0a3 3 0 1 1 6 0" fill="none" stroke="#a31c4c" stroke-width="2.2" stroke-linecap="round"/>', { ro: 0, rc: -120, cx: .1, cy: .1, d: .65 });
      return s;
    },

    tulip(S) {
      const cup = (ro, rc, fill, L, W, o) => pet(S, shapes.cup(L, W), fill, Object.assign({ ro, rc, stroke: 'rgba(170,30,90,.3)' }, o));
      return '<g transform="translate(0 36)">' +
        cup(0, 0, 'url(#g-tulip-d)', 84, 33, { sx: .8, sy: .98, cx: .7, cy: .9, d: .1 }) +
        cup(-25, -3, 'url(#g-tulip)', 88, 36, { cx: .62, cy: .92, d: 0 }) +
        cup(25, 3, 'url(#g-tulip)', 88, 36, { cx: .62, cy: .92, d: 0 }) +
        cup(0, 0, 'url(#g-tulip-f)', 82, 31, { sx: .96, cx: .82, cy: .97, d: .14 }) +
        '</g>';
    },

    /* solo = just the main blossom (used in the bouquet) */
    cherry(S, solo) {
      const blossom = (x, y, sc, rot, d0) => {
        let b = `<g transform="translate(${x} ${y}) scale(${sc}) rotate(${rot})">`;
        for (let i = 0; i < 5; i++) b += pet(S, shapes.notch(35, 24), 'url(#g-cherry)', { ro: i * 72, rc: i * 72 + 25, cx: .5, cy: .5, d: d0 + i * .08, stroke: 'rgba(235,100,150,.5)' });
        for (let j = 0; j < 8; j++) {
          b += grp(S, '<path d="M0 0L0 -11M-2 -12.6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" fill="#ffd66b" stroke="#e45a8a" stroke-width="1" stroke-linecap="round"/>', { ro: j * 45, rc: j * 45, cx: .2, cy: .2, d: d0 + .35 });
        }
        return b + '</g>';
      };
      let s = blossom(0, 0, 1, 0, 0);
      if (!solo) s += blossom(-56, 38, .62, 18, .25) + blossom(50, 56, .55, -12, .4);
      return s;
    },

    sunflower(S) {
      let s = '';
      for (let i = 0; i < 20; i++) s += pet(S, shapes.leaf(64, 12), 'url(#g-sun-b)', { ro: i * 18 + 9, rc: i * 18 + 9 - 95, cx: .42, cy: .5, d: i * .035, stroke: 'rgba(190,100,0,.3)' });
      for (let i = 0; i < 20; i++) s += pet(S, shapes.leaf(57, 13), 'url(#g-sun-a)', { ro: i * 18, rc: i * 18 - 95, cx: .42, cy: .5, d: .1 + i * .035, stroke: 'rgba(190,100,0,.3)' });
      let dark = '', light = '';
      for (let i = 0; i < 92; i++) {
        const r = 2.55 * Math.sqrt(i + 1), a = i * 2.39996, x = r * Math.cos(a), y = r * Math.sin(a), rad = 1.55 + (i % 3 === 0 ? .45 : 0);
        const dot = D`M${x - rad} ${y}a${rad} ${rad} 0 1 0 ${2 * rad} 0a${rad} ${rad} 0 1 0 ${-2 * rad} 0`;
        if (i % 2) light += dot; else dark += dot;
      }
      s += grp(S, `<circle r="27" fill="url(#g-disc)" stroke="#c98a2b" stroke-width="3"/><path d="${dark}" fill="#24120a"/><path d="${light}" fill="#a97543"/>`, { ro: 0, rc: -90, cx: .55, cy: .55, d: .3 });
      return s;
    },

    /* lavender is one plant, so its "head" runs all the way down to the ground (y = 222) */
    lavender(S, sprig) {
      let s = '';
      if (!sprig) for (let i = 0; i < 6; i++) s += leaf(0 + (i - 2.5) * 5, 222, (i - 2.5) * 15, 74 + (i % 2) * 14, 5);
      const spikes = sprig
        ? [{ x1: 0, y1: -62, cx: 0, cy: 0, from: 62, n: 10 }]
        : [{ x1: 0, y1: -34, cx: 6, cy: 90, from: 222, n: 11 }, { x1: -40, y1: -14, cx: -26, cy: 100, from: 222, n: 10 }, { x1: 40, y1: -14, cx: 26, cy: 100, from: 222, n: 10 }];
      spikes.forEach((sp, k) => {
        const P = t => [(1 - t) * (1 - t) * 0 + 2 * (1 - t) * t * sp.cx + t * t * sp.x1, (1 - t) * (1 - t) * sp.from + 2 * (1 - t) * t * sp.cy + t * t * sp.y1];
        s += stem(`M0 ${sp.from}Q${sp.cx} ${sp.cy} ${sp.x1} ${sp.y1}`, sprig ? 3 : 3.6);
        for (let i = 0; i < sp.n; i++) {
          const t = .42 + .58 * (i / (sp.n - 1)), [x, y] = P(t), [x2, y2] = P(Math.min(1, t + .02));
          const ang = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI + 90, taper = (1 - .45 * (i / (sp.n - 1))) * (sprig ? 1.55 : 1);
          const col = mixHex('#8a64d0', '#d3c0f6', i / (sp.n - 1));
          [-1, 1].forEach(side => {
            s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(ang + side * 30).toFixed(1)})">` +
              grp(S, `<ellipse cx="0" cy="${(-9 * taper).toFixed(1)}" rx="${(5.6 * taper).toFixed(1)}" ry="${(9.5 * taper).toFixed(1)}" fill="${col}" stroke="rgba(90,50,150,.22)" stroke-width=".7"/>`,
                { ro: 0, rc: 0, cx: .5, cy: .5, d: .08 * i + k * .1 }) + '</g>';
          });
          if (i === sp.n - 1) s += `<ellipse cx="${x.toFixed(1)}" cy="${(y - 8 * taper).toFixed(1)}" rx="4" ry="7" fill="${col}"/>`;
        }
      });
      return s;
    },

    hibiscus(S) {
      let s = '';
      for (let i = 0; i < 5; i++) s += pet(S, shapes.fan(66, 40), 'url(#g-hib)', { ro: i * 72, rc: i * 72 * .3 - 20, cx: .3, cy: .75, d: i * .07, stroke: 'rgba(160,20,80,.3)' });
      for (let i = 0; i < 5; i++) s += pet(S, shapes.leaf(33, 8.5), '#a41155', { ro: i * 72 + 8, rc: i * 72 * .3, cx: .2, cy: .3, d: .3 + i * .03, stroke: 'none' });
      s += '<circle r="6" fill="#7a0d3d"/>';
      let pol = '';
      for (let k = 0; k < 7; k++) pol += `<circle cx="${(22 + Math.cos(k * 1.1) * 5).toFixed(1)}" cy="${(-35 + Math.sin(k * 2.1) * 5).toFixed(1)}" r="2.3" fill="#ffd34f"/>`;
      s += grp(S, `<path d="M0 0Q9 -20 24 -34" fill="none" stroke="#ff8aa8" stroke-width="3.4" stroke-linecap="round"/>${pol}<circle cx="27" cy="-38" r="3.4" fill="#d6245f"/>`, { ro: 0, rc: 0, cx: .05, cy: .05, d: .62 });
      return s;
    },

    peony(S) {
      let s = '<ellipse cx="0" cy="12" rx="22" ry="15" fill="#8fc9a1"/>';
      const rings = [[7, 56, 36, 'g-peony-1', 0, .3], [7, 47, 33, 'g-peony-2', 25.7, .2], [6, 37, 28, 'g-peony-3', 0, .1], [5, 27, 21, 'g-peony-4', 36, 0]];
      rings.forEach(([n, L, W, g, off, d0]) => {
        for (let i = 0; i < n; i++) s += pet(S, shapes.ruffle(L, W), `url(#${g})`, { ro: off + i * 360 / n, rc: off + i * 360 / n * .3, cx: .55, cy: .58, d: d0 + i * .03, stroke: 'rgba(200,60,120,.28)' });
      });
      let st = '';
      for (let k = 0; k < 14; k++) { const a = k * 2.4, r = 3 + (k % 3) * 2.4; st += `<circle cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r).toFixed(1)}" r="1.7" fill="#ffd45a"/>`; }
      s += grp(S, st, { ro: 0, rc: 0, cx: .1, cy: .1, d: .5 });
      return s;
    },

    heart(S) {
      let s = '';
      for (let i = 0; i < 8; i++) s += grp(S, `<path d="${heart(15)}" transform="translate(0 -64)" fill="url(#g-heart-b)" stroke="rgba(220,60,120,.35)" stroke-width="1"/>`, { ro: i * 45, rc: i * 45, cx: .2, cy: .2, d: .15 + i * .04 });
      s += grp(S, `<path d="${heart(50)}" fill="url(#g-heart)" stroke="rgba(220,60,120,.4)" stroke-width="1.5"/>` +
        '<path d="M-27 -22C-27 -33 -17 -38 -10 -33" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round"/>' +
        '<circle cx="-17" cy="-12" r="2.6" fill="rgba(255,255,255,.8)"/>', { ro: 0, rc: 0, cx: .1, cy: .1, d: 0 });
      return s;
    }
  };

  /* ---------- whole plants: shadow, stem, leaves and head ---------- */
  const under = {
    rose:  () => stem('M100 112C95 175 106 250 100 324') + leaf(100, 262, -58, 52, 15) + leaf(100, 222, 56, 46, 13) + leaf(100, 296, 62, 40, 12),
    tulip: () => stem('M100 130C104 190 96 255 100 324') + leaf(100, 324, -16, 150, 24) + leaf(100, 324, 18, 130, 22) + leaf(100, 324, 4, 110, 18),
    cherry: () => stem('M100 324C98 250 103 170 100 106', 5, 'g-wood') + stem('M100 214Q80 176 44 138', 3.6, 'g-wood') + stem('M100 244Q127 205 150 156', 3.6, 'g-wood') +
      leaf(100, 280, -64, 34, 10) + leaf(100, 262, 60, 32, 9) + leaf(78, 190, -90, 24, 8) + leaf(124, 218, 75, 24, 8),
    sunflower: () => stem('M100 120C96 190 105 255 100 324', 9) + leaf(100, 270, -70, 66, 25) + leaf(100, 232, 66, 60, 23) + leaf(100, 300, 40, 48, 18),
    lavender: () => '',
    hibiscus: () => stem('M100 118C106 185 95 255 100 324') + leaf(100, 266, -60, 58, 20) + leaf(100, 226, 58, 52, 18) + leaf(100, 300, 64, 42, 15),
    peony: () => stem('M100 114C95 180 105 252 100 324') + leaf(100, 268, -62, 60, 20) + leaf(100, 230, 60, 54, 19) + leaf(100, 304, 52, 40, 14),
    heart: () => stem('M100 112C95 180 106 250 100 324', 6.5) + leaf(100, 262, -58, 56, 17) + leaf(100, 224, 58, 50, 15)
  };

  const plant = id => {
    const lav = id === 'lavender';
    return `<svg class="plant-svg" viewBox="0 0 200 330" aria-hidden="true" focusable="false">` +
      '<g class="ground"><ellipse cx="100" cy="326" rx="44" ry="7" fill="url(#g-shadow)"/>' + grass() + '</g>' + under[id]() +
      `<g class="head" transform="translate(100 100)"><circle class="glow" r="78" fill="url(#g-glow)"/><circle class="hint" r="22" fill="none" stroke="#fff" stroke-width="2.5"/>` +
      `<g class="${lav ? 'still' : 'bob'}">${heads[id](false)}</g></g></svg>`;
  };

  /* ---------- reusable symbols for icons and the bouquet ---------- */
  const symbols = () => ['rose', 'tulip', 'cherry', 'sunflower', 'lavender', 'hibiscus', 'peony', 'heart'].map(id => {
    const inner = id === 'cherry' ? heads.cherry(true, true) : id === 'lavender' ? heads.lavender(true, true) : heads[id](true);
    return `<symbol id="h-${id}" viewBox="-80 -80 160 160" overflow="visible">${inner}</symbol>`;
  }).join('');
  const icon = (id, cls = '') =>
    `<svg class="${cls}" viewBox="-80 -80 160 160" aria-hidden="true" focusable="false"><use href="#h-${id}" x="-80" y="-80" width="160" height="160"/></svg>`;

  /* ---------- extras ---------- */
  /* a leaf for bouquet greenery */

<script>
/* audio.js
   A gentle, generative music-box lullaby made with the Web Audio API (no audio files),
   plus soft sound effects for blooms, collecting and surprises.

   Browsers only allow sound after a tap, so nothing starts until Music.start() is called
   from a click handler. Music.toggle() is the mute / unmute button. */
const Music = (() => {
  const BPM = 62, BEAT = 60 / BPM, STEP = BEAT / 2, BAR = BEAT * 4;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const LEVEL = 1.5;   // master volume when un-muted

  /* Eight bars in C major (a Canon-style progression), repeated forever.
     tones = notes used for arpeggios and melody, pad = soft held chord, bass = root. */
  const CHORDS = [
    { bass: 48, tones: [60, 64, 67, 71, 72, 76], pad: [52, 59, 64, 67] },   // Cmaj7
    { bass: 47, tones: [59, 62, 67, 71, 74, 79], pad: [50, 55, 62, 67] },   // G/B
    { bass: 45, tones: [57, 60, 64, 67, 69, 72], pad: [52, 55, 60, 64] },   // Am7
    { bass: 52, tones: [59, 62, 64, 67, 71, 74], pad: [50, 55, 59, 64] },   // Em7
    { bass: 53, tones: [57, 60, 64, 65, 69, 72], pad: [48, 57, 60, 64] },   // Fmaj7
    { bass: 52, tones: [55, 60, 64, 67, 72, 76], pad: [48, 55, 60, 64] },   // C/E
    { bass: 50, tones: [57, 60, 62, 65, 69, 72], pad: [48, 57, 60, 65] },   // Dm7
    { bass: 55, tones: [55, 59, 62, 67, 71, 74], pad: [50, 55, 59, 62] }    // G
  ];
  const ARP = [[0, 2, 3, 4, 5, 4, 3, 2], [0, 1, 3, 5, 4, 3, 2, 1], [0, 2, 4, 5, 3, 4, 2, 1], [0, 1, 2, 4, 5, 4, 2, 3]];
  const SCALE = [72, 74, 76, 77, 79, 81, 83, 84, 86, 88];   // C major, C5 – E6
  const PENTA = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93];   // sparkle notes for effects

  let ctx = null, master = null, dry = null, verb = null, echo = null;
  let timer = null, on = false, nextTime = 0, bar = 0, step = 0, lastMel = 79, silent = null;

  /* ---------- graph ---------- */
  function buildGraph() {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .3;
    master.connect(comp); comp.connect(ctx.destination);

    dry = ctx.createGain(); dry.gain.value = .9; dry.connect(master);

    verb = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 3.4), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let lp = 0;
      for (let i = 0; i < len; i++) { lp += ((Math.random() * 2 - 1) - lp) * .32; d[i] = lp * Math.pow(1 - i / len, 2.7) * 1.8; }
    }
    verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .62;
    verb.connect(wet); wet.connect(master);

    echo = ctx.createGain(); echo.gain.value = 1;
    const dl = ctx.createDelay(2); dl.delayTime.value = BEAT * .75;
    const fb = ctx.createGain(); fb.gain.value = .34;
    const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 2400;
    echo.connect(dl); dl.connect(lpf); lpf.connect(fb); fb.connect(dl); lpf.connect(verb); lpf.connect(dry);
  }

  /* ---------- voices ---------- */
  const out = (node, send = .4, delay = 0) => {
    node.connect(dry);
    const s = ctx.createGain(); s.gain.value = send; node.connect(s); s.connect(verb);
    if (delay) { const e = ctx.createGain(); e.gain.value = delay; node.connect(e); e.connect(echo); }
  };

  /* a music-box / glockenspiel note */
  function bell(m, t, vel = .06, dur = 1.8, send = .5, delay = 0) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + .005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out(g, send, delay);
    [[1, 1, dur], [2, .32, dur * .55], [4.02, .1, dur * .22]].forEach(([mul, amp, d]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(m) * mul;
      og.gain.setValueAtTime(amp, t); og.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .05);
      o.onended = () => { try { og.disconnect(); } catch (e) {} };
    });
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, (t - ctx.currentTime + dur + .3) * 1000);
  }

  /* slow breathing pad */
  function pad(notes, t, dur) {
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 880; f.Q.value = .4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(.03, t + 1.3);
    g.gain.setValueAtTime(.03, t + dur - .6);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 1.6);
    f.connect(g); out(g, .55);
    notes.forEach(m => [-6, 6].forEach(det => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 1.7);
    }));
    setTimeout(() => { try { g.disconnect(); f.disconnect(); } catch (e) {} }, (t - ctx.currentTime + dur + 2) * 1000);
  }

  function bass(m, t) {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = hz(m); f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.085, t + .06); g.gain.exponentialRampToValueAtTime(0.0001, t + BAR * .95);
    o.connect(f); f.connect(g); out(g, .15);
    o.start(t); o.stop(t + BAR);
    o.onended = () => { try { g.disconnect(); } catch (e) {} };
  }

  /* pick the next melody note: stepwise, leaning on chord tones */
  function melody(chord) {
    const cand = SCALE.map(n => {
      const ct = chord.tones.some(c => c % 12 === n % 12) ? 3 : 1;
      return [n, ct * Math.exp(-Math.abs(n - lastMel) / 3.2) * (n === lastMel ? .35 : 1)];
    });
    let r = Math.random() * cand.reduce((a, c) => a + c[1], 0);
    for (const [n, w] of cand) { r -= w; if (r <= 0) return (lastMel = n); }
    return (lastMel = 79);
  }

  /* ---------- scheduler ---------- */
  function tick() {
    if (!ctx) return;
    while (nextTime < ctx.currentTime + .5) {
      const chord = CHORDS[bar % CHORDS.length], t = nextTime;
      if (step === 0) { pad(chord.pad, t, BAR); bass(chord.bass, t); }
      const pat = ARP[Math.floor(bar / 2) % ARP.length];
      bell(chord.tones[pat[step]], t, step % 4 === 0 ? .05 : .034, 1.5, .5, .22);
      if (step % 2 === 0 && (step === 0 || Math.random() > .3)) {
        bell(melody(chord), t + .015, step === 0 ? .06 : .048, 2.6, .8, .1);
      }
      nextTime += STEP;
      if (++step === 8) { step = 0; bar++; }
    }
  }

  /* ---------- keep iOS from muting Web Audio when the ringer switch is off ---------- */
  function unlockIOS() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios || silent) return;
      const n = 800, b = new Uint8Array(44 + n);
      const w = (o, s) => [...s].forEach((c, i) => (b[o + i] = c.charCodeAt(0)));
      const u32 = (o, v) => { for (let i = 0; i < 4; i++) b[o + i] = (v >> (8 * i)) & 255; };
      w(0, 'RIFF'); u32(4, 36 + n); w(8, 'WAVEfmt '); u32(16, 16); b[20] = 1; b[22] = 1; u32(24, 8000); u32(28, 8000); b[32] = 1; b[34] = 8; w(36, 'data'); u32(40, n);
      b.fill(128, 44);
      silent = new Audio('data:audio/wav;base64,' + btoa(String.fromCharCode(...b)));
      silent.loop = true; silent.volume = .01; silent.play().catch(() => {});
    } catch (e) {}
  }

  const ramp = v => { if (master) master.gain.setTargetAtTime(v, ctx.currentTime, .25); };

  /* ---------- public ---------- */
  const api = {
    get on() { return on; },
    started: () => !!ctx,
    start() {
      unlockIOS();
      if (!ctx) {
        try { buildGraph(); } catch (e) { return false; }
        nextTime = ctx.currentTime + .15;
        timer = setInterval(tick, 90);
        document.addEventListener('visibilitychange', () => {
          if (!ctx) return;
          if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
        });
      }
      ctx.resume();
      on = true; ramp(LEVEL);
      return true;
    },
    toggle() {
      if (!ctx) return api.start();
      on = !on;
      if (on) ctx.resume();
      ramp(on ? LEVEL : 0);
      return on;
    },

    /* sound effects (silent while muted) */
    chime(i = 0) {
      if (!ctx || !on) return; const t = ctx.currentTime + .02;
      [0, 2, 3, 4].forEach((k, j) => bell(PENTA[Math.min(PENTA.length - 1, i + k)], t + j * .11, .07, 2.2, .9, .2));
    },
    collect() {
      if (!ctx || !on) return; const t = ctx.currentTime + .02;
      bell(84, t, .08, 1.4, .8, .25); bell(91, t + .1, .08, 1.8, .9, .25); bell(96, t + .2, .05, 2.2, 1, .3);
    },
    pop() {
      if (!ctx || !on) return; bell(PENTA[4 + ((Math.random() * 5) | 0)], ctx.currentTime + .01, .05, 1.2, .8, .15);
    },
    whisper() {
      if (!ctx || !on) return; const t = ctx.currentTime + .02;
      bell(88, t, .06, 1.6, .9, .2); bell(95, t + .13, .05, 2, .9, .3);
    },
    unlock() {
      if (!ctx || !on) return; const t = ctx.currentTime + .05;
      for (let i = 0; i < 12; i++) bell(PENTA[i % PENTA.length] + (i >= 10 ? 12 : 0), t + i * .1, .06, 2.4, .9, .2);
    },
    swell() {
      if (!ctx || !on) return; const t = ctx.currentTime + .05;
      pad([48, 55, 60, 64, 67, 71], t, 5);
      [72, 76, 79, 83, 86, 91, 95].forEach((n, i) => bell(n, t + .4 + i * .16, .06, 3, 1, .3));
    }
  };
  return api;
})();

<script>
/* fx.js
   Two full-screen canvases:
     fx-bg  (behind the flowers)  floating hearts, glowing motes, drifting petals, fireflies at dusk
     fx-fg  (in front)            butterflies and every bloom / collect / finale effect
   Everything is sprite based (pre-drawn once, then stamped) so it stays smooth on a phone. */
const FX = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const easeOut = u => 1 - Math.pow(1 - u, 3);
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  };

  let cb, cf, xb, xf, W = 0, H = 0, dpr = 1, dusk = 0, running = false, last = 0;
  const parts = [], fxs = [], ambient = { motes: [], hearts: [], petals: [], flies: [] }, flies = [];
  let rain = null;

  /* ---------- sprites ---------- */
  const SP = {};
  const sprite = (key, w, h, draw) => {
    if (SP[key]) return SP[key];
    const c = document.createElement('canvas');
    c.width = w * 2; c.height = h * 2;
    const x = c.getContext('2d');
    x.scale(2, 2);
    draw(x, w, h);
    return (SP[key] = { c, w, h });
  };
  const glowSp = col => sprite('glow' + col, 64, 64, x => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, rgba(col, 1)); g.addColorStop(.35, rgba(col, .5)); g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  });
  const heartSp = (c1, c2) => sprite('heart' + c1 + c2, 64, 64, x => {
    x.translate(32, 31);
    const p = new Path2D(Art.heart(26));
    const g = x.createLinearGradient(-22, -24, 22, 26);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.fillStyle = g; x.fill(p);
    x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 1.2; x.stroke(p);
    x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.ellipse(-10, -14, 5.5, 3, -.7, 0, TAU); x.fill();
  });
  const petalSp = (c1, c2) => sprite('petal' + c1 + c2, 30, 42, x => {
    x.translate(15, 21); x.scale(13, 19);
    const g = x.createLinearGradient(0, -1, 0, 1);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, -1); x.bezierCurveTo(.95, -.55, .85, .65, 0, 1); x.bezierCurveTo(-.85, .65, -.95, -.55, 0, -1); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = .06; x.beginPath(); x.moveTo(0, -.7); x.lineTo(0, .7); x.stroke();
  });
  const sparkSp = col => sprite('spark' + col, 48, 48, x => {
    x.translate(24, 24);
    const g = x.createRadialGradient(0, 0, 0, 0, 0, 24);
    g.addColorStop(0, rgba(col, .55)); g.addColorStop(1, rgba(col, 0));
    x.fillStyle = g; x.fillRect(-24, -24, 48, 48);
    x.fillStyle = '#fff'; x.strokeStyle = col; x.lineWidth = 1.4;
    x.beginPath(); x.moveTo(0, -20); x.quadraticCurveTo(2.6, -2.6, 20, 0); x.quadraticCurveTo(2.6, 2.6, 0, 20); x.quadraticCurveTo(-2.6, 2.6, -20, 0); x.quadraticCurveTo(-2.6, -2.6, 0, -20);
    x.fill(); x.stroke();
  });
  const wingsSp = (a, b, c) => sprite('wing' + a + b + c, 120, 100, x => {
    x.translate(60, 50);
    for (const m of [1, -1]) {
      x.save(); x.scale(m, 1);
      let g = x.createLinearGradient(0, 0, 50, -30); g.addColorStop(0, b); g.addColorStop(1, a);
      x.fillStyle = g; x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(2, -2); x.bezierCurveTo(14, -40, 52, -46, 56, -20); x.bezierCurveTo(58, 2, 28, 10, 2, -2); x.fill(); x.stroke();
      g = x.createLinearGradient(0, 0, 30, 40); g.addColorStop(0, b); g.addColorStop(1, c);
      x.fillStyle = g;
      x.beginPath(); x.moveTo(2, 2); x.bezierCurveTo(26, 4, 42, 24, 32, 38); x.bezierCurveTo(22, 48, 6, 28, 2, 2); x.fill(); x.stroke();
      x.fillStyle = 'rgba(255,255,255,.8)';
      x.beginPath(); x.arc(38, -22, 3.2, 0, TAU); x.arc(26, -12, 2.2, 0, TAU); x.arc(26, 28, 2.6, 0, TAU); x.fill();
      x.restore();
    }
    x.fillStyle = '#6a4a76'; x.beginPath(); x.ellipse(0, 0, 2.4, 14, 0, 0, TAU); x.fill();
  });

  const PINKS = [['#ffc4d8', '#ff6f9f'], ['#ffd8e6', '#ff8fb5'], ['#ffa6c4', '#ff5c93'], ['#e2d3fa', '#a98be0'], ['#ffffff', '#ffc1d6']];
  const PETALS = {
    rose: ['#ef5b86', '#b8244f'], cherry: ['#fff3f8', '#ffa6c4'], peony: ['#ffd6e6', '#ff8fb9'],
    lavender: ['#e0d2f9', '#a183e0'], gold: ['#fff2b0', '#ffb733'], pink: ['#ffc8da', '#ff7aa7']
  };
  const BUTTERFLIES = [['#ffa6cc', '#fff', '#c7aaf3'], ['#c7aaf3', '#fff', '#ffa6cc'], ['#ffc99a', '#fff', '#ffa6cc'], ['#ffffff', '#ffd6e6', '#cbb6f2']];

  /* ---------- particles ---------- */
  function spawn(o) {
    if (parts.length > 900) return;
    parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, rot: 0, vr: 0, s: 1, life: 1, age: 0, delay: 0, a: 1, sway: 0, swf: 2, ph: rnd(0, TAU), flip: 0, sp: null }, o));
  }
  const heartP = (x, y, o) => { const c = pick(PINKS); spawn(Object.assign({ x, y, sp: heartSp(c[0], c[1]) }, o)); };
  const sparkP = (x, y, o, col = '#ffc94d') => spawn(Object.assign({ x, y, sp: sparkSp(col) }, o));
  const petalP = (x, y, kind, o) => { const c = PETALS[kind]; spawn(Object.assign({ x, y, sp: petalSp(c[0], c[1]), flip: rnd(3, 7) }, o)); };
  const glowP = (x, y, col, o) => spawn(Object.assign({ x, y, sp: glowSp(col) }, o));

  function ring(x, y, col, maxR = 120, life = 1, w = 3, delay = 0) {
    fxs.push({ delay, life, age: 0, draw(c, u) {
      c.globalAlpha = (1 - u) * .85; c.strokeStyle = col; c.lineWidth = w * (1 - u * .6);
      c.beginPath(); c.arc(x, y, maxR * easeOut(u), 0, TAU); c.stroke();
    } });
  }
  function flash(x, y, col, maxR, life = 1, delay = 0, peak = .8) {
    fxs.push({ delay, life, age: 0, draw(c, u) {
      const r = maxR * (.35 + .65 * easeOut(u)), g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(col, peak * (1 - u))); g.addColorStop(1, rgba(col, 0));
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    } });
  }
  function rays(x, y, col, life = 2.4) {
    fxs.push({ life, age: 0, draw(c, u) {
      const R = Math.hypot(W, H), a = Math.min(1, u * 6) * Math.pow(1 - u, 1.4) * .55;
      c.save(); c.translate(x, y); c.rotate(u * .8);
      const g = c.createRadialGradient(0, 0, 8, 0, 0, R * .85);
      g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
      c.fillStyle = g;
      for (let i = 0; i < 14; i++) {
        const ang = i * TAU / 14, w = .085;
        c.beginPath(); c.moveTo(0, 0);
        c.lineTo(Math.cos(ang - w) * R, Math.sin(ang - w) * R); c.lineTo(Math.cos(ang + w) * R, Math.sin(ang + w) * R);
        c.closePath(); c.fill();
      }
      c.restore();
    } });
  }

  /* ---------- one-off effects ---------- */
  const lite = () => (reduce ? .5 : W < 520 ? .75 : 1);
  const effects = {
    /* a spiral of rose petals unfurls, then drifts down */
    rose(x, y) {
      const n = Math.round(24 * lite());
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU * 2.2, sp = 60 + i * 8;
        petalP(x, y, 'rose', { delay: i * .035, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50, g: 55, drag: 1.5, rot: rnd(0, TAU), vr: rnd(-3, 3), s: rnd(.42, .75), life: rnd(2.8, 4), sway: 26, swf: rnd(2, 3.4) });
      }
      ring(x, y, '#e8578f', 150, 1, 4); ring(x, y, '#ff9bb8', 100, .9, 2.5, .15);
      flash(x, y, '#ff7fa6', 190, 1.4);
    },
    /* ripples and a column of golden sparkles */
    tulip(x, y) {
      for (let i = 0; i < 3; i++) ring(x, y, '#ff6fa3', 120 + i * 46, 1.3, 3.5, i * .22);
      for (let i = 0; i < Math.round(22 * lite()); i++) sparkP(x, y, { delay: i * .05, vx: rnd(-26, 26), vy: -rnd(60, 150), g: 22, drag: .6, s: rnd(.3, .62), life: rnd(1.4, 2.2), rot: rnd(-.6, .6), vr: rnd(-2, 2) });
      flash(x, y, '#ffb3cf', 170, 1.2);
    },
    /* a storm of cherry petals over the whole garden */
    cherry(x, y) {
      const n = Math.round(54 * lite());
      for (let i = 0; i < n; i++) petalP(rnd(-20, W + 20), rnd(-80, -10), 'cherry', { delay: rnd(0, 3.2), vx: rnd(10, 50), vy: rnd(70, 130), drag: 0, rot: rnd(0, TAU), vr: rnd(-2.5, 2.5), s: rnd(.5, .95), life: rnd(5.5, 8), sway: rnd(30, 60), swf: rnd(1.4, 2.6) });
      for (let i = 0; i < 14; i++) petalP(x, y, 'cherry', { vx: rnd(-90, 90), vy: -rnd(40, 130), g: 70, drag: 1, rot: rnd(0, TAU), vr: rnd(-4, 4), s: rnd(.5, .8), life: rnd(2.2, 3.4), sway: 20 });
      ring(x, y, '#ffa6c4', 130, 1.1, 3); flash(x, y, '#ffd0e1', 200, 1.3);
    },
    /* rays of sunshine fan out across the sky */
    sunflower(x, y) {
      rays(x, y, '#ffd24a', 2.8);
      flash(x, y, '#fff0a0', Math.max(W, H) * .6, 1.6, 0, .55);
      for (let i = 0; i < Math.round(32 * lite()); i++) { const a = rnd(0, TAU), sp = rnd(90, 330); sparkP(x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 1.4, s: rnd(.3, .6), life: rnd(1.2, 2), rot: rnd(0, 3), vr: rnd(-3, 3) }, '#ffb300'); }
      ring(x, y, '#ffb300', 170, 1.2, 4);
    },
    /* violet fireflies rise in a calm wave */
    lavender(x, y) {
      for (let i = 0; i < Math.round(26 * lite()); i++) glowP(x + rnd(-70, 70), y + rnd(-20, 120), '#b79cf2', { delay: i * .07, vx: rnd(-10, 10), vy: -rnd(30, 80), drag: .1, s: rnd(.4, .85), life: rnd(2.6, 4.2), sway: rnd(14, 34), swf: rnd(1.5, 3), a: .95 });
      for (let i = 0; i < 12; i++) sparkP(x + rnd(-60, 60), y + rnd(-10, 100), { delay: i * .1, vy: -rnd(20, 50), s: rnd(.25, .45), life: rnd(1.8, 2.6), vr: 1 }, '#a183e0');
      ring(x, y + 40, '#a183e0', 160, 1.8, 3); ring(x, y + 40, '#cdb8f0', 220, 2, 2, .3);
      flash(x, y + 40, '#cdb8f0', 230, 1.8);
    },
    /* a burst of little hearts */
    hibiscus(x, y) {
      for (let i = 0; i < Math.round(24 * lite()); i++) { const a = i / 24 * TAU + rnd(-.1, .1), sp = rnd(120, 280); heartP(x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, g: -20, drag: 1.7, s: rnd(.28, .6), life: rnd(1.6, 2.6), rot: rnd(-.5, .5), vr: rnd(-1.5, 1.5) }); }
      ring(x, y, '#ff6fa3', 140, 1, 4); flash(x, y, '#ff8fb9', 190, 1.2);
    },
    /* a confetti pop */
    peony(x, y) {
      const kinds = ['peony', 'cherry', 'rose'];
      for (let i = 0; i < Math.round(46 * lite()); i++) {
        const a = rnd(0, TAU), sp = rnd(120, 380), r = Math.random();
        const o = { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, g: 260, drag: 1.2, s: rnd(.4, .8), life: rnd(1.8, 3), rot: rnd(0, TAU), vr: rnd(-6, 6) };
        if (r < .5) petalP(x, y, pick(kinds), o); else if (r < .8) heartP(x, y, o); else sparkP(x, y, o);
      }
      ring(x, y, '#ff8fb9', 150, 1, 4); ring(x, y, '#ffc6dc', 220, 1.2, 2.5, .12);
      flash(x, y, '#ffb6d2', 260, 1.2);
    },
    /* the heart flower: a fountain of hearts */
    heart(x, y) {
      for (let i = 0; i < Math.round(40 * lite()); i++) heartP(x, y, { delay: i * .04, vx: rnd(-120, 120), vy: -rnd(180, 420), g: 280, drag: .5, s: rnd(.3, .72), life: rnd(2, 3), rot: rnd(-.4, .4), vr: rnd(-1.5, 1.5) });
      for (let i = 0; i < 18; i++) sparkP(x, y, { vx: rnd(-200, 200), vy: rnd(-250, 60), g: 60, s: rnd(.3, .6), life: rnd(1.4, 2.2), vr: rnd(-3, 3) });
      ring(x, y, '#ff3f84', 190, 1.4, 5); ring(x, y, '#ffb2cd', 280, 1.6, 3, .2);
      flash(x, y, '#ff9fc0', 320, 1.6);
    }
  };

  /* ---------- helpers for the game ---------- */
  const api = {
    bloom(id, x, y) { (effects[id] || effects.peony)(x, y); },
    /* little hearts and sparkles wherever she taps */
    tap(x, y) {
      for (let i = 0; i < 4; i++) heartP(x, y, { vx: rnd(-50, 50), vy: -rnd(40, 110), g: -10, drag: .8, s: rnd(.2, .42), life: rnd(1, 1.6), rot: rnd(-.5, .5), vr: rnd(-1, 1), delay: i * .04 });
      for (let i = 0; i < 4; i++) sparkP(x, y, { vx: rnd(-70, 70), vy: rnd(-70, 40), drag: 1.2, s: rnd(.2, .4), life: rnd(.7, 1.2), vr: rnd(-3, 3) });
    },
    hearts(x, y, n = 10, spread = 160) {
      for (let i = 0; i < n; i++) heartP(x, y, { vx: rnd(-spread, spread), vy: -rnd(60, 220), g: 120, drag: .8, s: rnd(.25, .55), life: rnd(1.4, 2.4), rot: rnd(-.5, .5), vr: rnd(-1.5, 1.5) });
    },
    sparkles(x, y, n = 10, spread = 140, col = '#ffc94d') {
      for (let i = 0; i < n; i++) sparkP(x, y, { vx: rnd(-spread, spread), vy: rnd(-spread, spread * .5), drag: 1.3, s: rnd(.22, .5), life: rnd(.8, 1.5), vr: rnd(-3, 3) }, col);
    },
    trail(x, y) {
      sparkP(x + rnd(-6, 6), y + rnd(-6, 6), { vx: rnd(-20, 20), vy: rnd(-10, 30), s: rnd(.2, .4), life: rnd(.5, .9), vr: rnd(-3, 3) });
      if (Math.random() < .5) heartP(x, y, { vx: rnd(-30, 30), vy: rnd(-20, 20), s: rnd(.15, .25), life: rnd(.5, .9) });
    },
    ring, flash,
    /* a lazy swirl of orbiting sparkles used by the finale */
    swirl(x, y, n = 20) {
      for (let i = 0; i < n; i++) { const a = rnd(0, TAU), sp = rnd(80, 260); sparkP(x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 1.2, s: rnd(.25, .55), life: rnd(1, 1.8), vr: rnd(-3, 3) }); }
    },
    petalRain(kind, seconds, perSec) { rain = { kind, until: performance.now() + seconds * 1000, perSec, acc: 0 }; },
    confetti(x, y) { effects.peony(x, y); },
    /* 0 = bright morning, 1 = dusk with fireflies */
    setDusk(p) { dusk = p; },
    clear() { parts.length = 0; fxs.length = 0; rain = null; }
  };

  /* ---------- ambient layer ---------- */
  function seedAmbient() {
    const small = W < 520, k = reduce ? .5 : 1;
    const mk = (n, f) => Array.from({ length: Math.round(n * k) }, f);
    ambient.motes = mk(small ? 22 : 38, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(3, 9), vy: -rnd(4, 14), ph: rnd(0, TAU), sp: rnd(.5, 1.4), col: pick(['#ffffff', '#ffe9a8', '#ffd0e4', '#e6d8ff']) }));
    ambient.hearts = mk(small ? 7 : 12, () => ({ x: rnd(0, W), y: rnd(0, H), s: rnd(.22, .55), vy: -rnd(14, 32), ph: rnd(0, TAU), amp: rnd(8, 26), a: rnd(.35, .7), c: pick(PINKS) }));
    ambient.petals = mk(small ? 6 : 10, () => ({ x: rnd(0, W), y: rnd(0, H), vx: rnd(8, 22), vy: rnd(14, 30), rot: rnd(0, TAU), vr: rnd(-1, 1), flip: rnd(1.5, 3), ph: rnd(0, TAU), k: pick(['cherry', 'pink', 'cherry']) }));
    ambient.flies = Array.from({ length: small ? 12 : 20 }, () => ({ x: rnd(0, W), y: rnd(H * .35, H * .95), ph: rnd(0, TAU), sp: rnd(.4, 1), r: rnd(8, 16) }));
    flies.length = 0;
    for (let i = 0; i < (small ? 3 : 4); i++) {
      const c = BUTTERFLIES[i % BUTTERFLIES.length];
      flies.push({ x: rnd(0, W), y: rnd(H * .2, H * .7), vx: 0, vy: 0, tx: rnd(0, W), ty: rnd(H * .15, H * .75), ph: rnd(0, TAU), sp: rnd(70, 105), sz: rnd(.34, .5), sp2: wingsSp(c[0], c[1], c[2]) });
    }
  }

  function drawAmbient(dt, t) {
    const c = xb;
    for (const m of ambient.motes) {
      m.y += m.vy * dt; m.x += Math.sin(t * m.sp + m.ph) * 8 * dt;
      if (m.y < -20) { m.y = H + 20; m.x = rnd(0, W); }
      c.globalAlpha = (.35 + .35 * Math.sin(t * m.sp * 1.6 + m.ph)) * (1 - dusk * .15);
      const sp = glowSp(m.col), s = m.r * 4;
      c.drawImage(sp.c, m.x - s / 2, m.y - s / 2, s, s);
    }
    for (const h of ambient.hearts) {
      h.y += h.vy * dt;
      if (h.y < -40) { h.y = H + 40; h.x = rnd(0, W); }
      const x = h.x + Math.sin(t * .8 + h.ph) * h.amp, sp = heartSp(h.c[0], h.c[1]), s = 44 * h.s * (W < 520 ? 1.15 : 1);
      c.globalAlpha = h.a * Math.min(1, (H - h.y) / 80, h.y / 80 + .2);
      c.save(); c.translate(x, h.y); c.rotate(Math.sin(t + h.ph) * .3);
      c.drawImage(sp.c, -s / 2, -s / 2, s, s); c.restore();
    }
    for (const p of ambient.petals) {
      p.x += (p.vx + Math.sin(t + p.ph) * 14) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > H + 30 || p.x > W + 30) { p.y = -30; p.x = rnd(-60, W); }
      const sp = petalSp(PETALS[p.k][0], PETALS[p.k][1]);
      c.globalAlpha = .75;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, .45 + .55 * Math.abs(Math.cos(t * p.flip + p.ph)));
      c.drawImage(sp.c, -9, -12.5, 18, 25); c.restore();
    }
    if (dusk > .02) {
      const n = Math.round(ambient.flies.length * dusk);
      for (let i = 0; i < n; i++) {
        const f = ambient.flies[i];
        f.x += Math.sin(t * f.sp + f.ph) * 14 * dt; f.y += Math.cos(t * f.sp * 1.3 + f.ph) * 10 * dt;
        const a = .5 + .5 * Math.sin(t * f.sp * 2.2 + f.ph * 2), s = f.r * 4;
        c.globalAlpha = a * Math.min(1, dusk * 1.4);
        const sp = glowSp('#ffe08a'); c.drawImage(sp.c, f.x - s / 2, f.y - s / 2, s, s);
        c.globalAlpha = a; c.fillStyle = '#fffbe0'; c.beginPath(); c.arc(f.x, f.y, 1.6, 0, TAU); c.fill();
      }
    }
    c.globalAlpha = 1;
  }

  function drawButterflies(dt, t) {
    const c = xf;
    for (const b of flies) {
      const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
      if (d < 50) { b.tx = rnd(W * .04, W * .96); b.ty = rnd(H * .12, H * .78); }
      const wob = Math.sin(t * 2.2 + b.ph) * 55;
      b.vx += ((dx / (d || 1)) * b.sp - b.vx + Math.cos(t * 1.7 + b.ph) * wob) * dt * 1.4;
      b.vy += ((dy / (d || 1)) * b.sp - b.vy + Math.sin(t * 2.3 + b.ph) * wob) * dt * 1.4;
      b.x += b.vx * dt; b.y += b.vy * dt;
      const ang = Math.atan2(b.vy, b.vx) + Math.PI / 2, flap = .22 + .78 * Math.abs(Math.cos(t * 9 + b.ph));
      c.save(); c.translate(b.x, b.y); c.rotate(ang); c.scale(b.sz, b.sz); c.globalAlpha = .95;
      c.save(); c.scale(flap, 1); c.drawImage(b.sp2.c, -60, -50, 120, 100); c.restore();
      c.restore();
    }
    c.globalAlpha = 1;
  }

  function drawParticles(dt) {
    const c = xf;
    if (rain) {
      if (performance.now() > rain.until) rain = null;
      else {
        rain.acc += dt * rain.perSec * lite();
        while (rain.acc >= 1) { rain.acc--; petalP(rnd(-20, W + 20), -30, rain.kind, { vx: rnd(10, 50), vy: rnd(80, 140), rot: rnd(0, TAU), vr: rnd(-2.5, 2.5), s: rnd(.5, .95), life: rnd(5, 8), sway: rnd(30, 60), swf: rnd(1.4, 2.6) }); }
      }
    }
    for (let i = fxs.length - 1; i >= 0; i--) {
      const e = fxs[i];
      if (e.delay > 0) { e.delay -= dt; continue; }
      e.age += dt;
      if (e.age >= e.life) { fxs.splice(i, 1); continue; }
      c.save(); e.draw(c, e.age / e.life); c.restore();
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      const u = p.age / p.life, k = Math.max(0, 1 - p.drag * dt);
      p.vx *= k; p.vy = p.vy * k + p.g * dt;
      p.x += (p.vx + (p.sway ? Math.cos(p.age * p.swf + p.ph) * p.sway : 0)) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      c.globalAlpha = p.a * Math.min(1, u / .08) * Math.min(1, (1 - u) / .3);
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      if (p.flip) c.scale(1, .35 + .65 * Math.abs(Math.cos(p.age * p.flip + p.ph)));
      const w = p.sp.w * p.s, h = p.sp.h * p.s;
      c.drawImage(p.sp.c, -w / 2, -h / 2, w, h); c.restore();
    }
    c.globalAlpha = 1;
  }

  /* ---------- loop ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts;
    if (document.hidden) return;
    xb.clearRect(0, 0, W, H); xf.clearRect(0, 0, W, H);
    drawAmbient(dt, ts / 1000); drawButterflies(dt, ts / 1000); drawParticles(dt);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const [cv, x] of [[cb, xb], [cf, xf]]) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  api.init = (bgCanvas, fgCanvas) => {
    cb = bgCanvas; cf = fgCanvas; xb = cb.getContext('2d'); xf = cf.getContext('2d');
    resize(); seedAmbient();
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { resize(); seedAmbient(); }, 150); });
    if (!running) { running = true; requestAnimationFrame(frame); }
  };
  api.size = () => ({ W, H });

  return api;
})();

</script>
<script>
/* game.js
   The whole experience, in order:
     welcome  ->  garden (tap 7 buds, each blooms and reveals a message)  ->  secret heart flower
     ->  "Do you know how beautiful you are?"  ->  finale (flowers fly together into a heart bouquet)
     ->  envelope -> the letter -> "The garden will always bloom for you"  ->  replay                */
(() => {
  'use strict';
  const C = window.GARDEN;
  const TAU = Math.PI * 2;
  const $ = (s, el = document) => el.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const nextFrame = () => new Promise(r => requestAnimationFrame(r));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const easeInOut = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

  const IDS = C.flowers.map(f => f.id);
  const TOTAL = IDS.length;
  const DATA = Object.fromEntries(C.flowers.map(f => [f.id, f]));

  /* where each plant stands: x, y = base position in % of the screen, s = size */
  const LAYOUT = {
    cherry:    { x: 50, y: 55, s: .9 },
    lavender:  { x: 18, y: 59, s: .92 },
    sunflower: { x: 82, y: 59, s: .98 },
    tulip:     { x: 29, y: 71, s: .95 },
    hibiscus:  { x: 71, y: 71, s: .95 },
    rose:      { x: 15, y: 86, s: 1.08 },
    peony:     { x: 85, y: 86, s: 1.08 },
    heart:     { x: 50, y: 87, s: 1.2 }
  };
  const WELCOME_FLOWERS = [   // id, x, y, size, entrance delay
    ['lavender', 18, 93, .9, .5], ['sunflower', 82, 93, 1, .6],
    ['peony', 6, 99, 1.2, .2], ['rose', 29, 101, 1.1, .3], ['tulip', 71, 101, 1.08, .35], ['hibiscus', 94, 99, 1.2, .25]
  ];
  const WHISPER_EMOJI = { sun: '☀️', cloud: '☁️', star: '⭐', butterfly: '🦋', firefly: '✨', ladybug: '🐞', heart: '💗', envelope: '💌' };

  const S = { screen: 'welcome', collected: new Set(), order: {}, found: new Set(), busy: false, endShown: false, fresh: true };

  /* ======================================================================

  const setScreen = name => { S.screen = name; document.body.dataset.screen = name; };

  const headPos = plant => { const r = plant.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height * .303, w: r.width, r }; };

  /* split text into words that fade in one after another */

  /* ======================================================================

  function hitShapes(id) {
    if (id === 'lavender') return '<rect class="hit" x="36" y="30" width="128" height="296"/>';
    if (id === 'cherry') return '<rect class="hit" x="14" y="36" width="172" height="190"/><rect class="hit" x="84" y="190" width="32" height="134"/>';
    return '<circle class="hit" cx="100" cy="100" r="68"/><rect class="hit" x="80" y="120" width="40" height="204"/>';

  function buildGarden() {
    const stage = $('#stage'); stage.innerHTML = ''; plants = {};
    const order = shuffle(IDS.slice());
    [...IDS, 'heart'].forEach(id => {
      const L = LAYOUT[id], isHeart = id === 'heart';
      const p = document.createElement('div');
      p.className = 'plant'; p.dataset.id = id; p.tabIndex = isHeart ? -1 : 0; p.setAttribute('role', 'button');
      p.setAttribute('aria-label', isHeart ? 'The glowing heart flower' : `${DATA[id].name}, tap to make it bloom`);
      const gd = (.15 + order.indexOf(id) * .16).toFixed(2);
      p.style.cssText = `--x:${L.x}%;--y:${L.y}%;--s:${L.s};--gd:${gd}s;z-index:${10 + Math.round(L.y / 4)}`;
      p.innerHTML = `<div class="grow"><div class="sway" style="--sd:${(-Math.random() * 5).toFixed(1)}s;--sw:${(5 + Math.random() * 3).toFixed(1)}s">${Art.plant(id)}</div></div>`;
      p.querySelector('svg').insertAdjacentHTML('beforeend', hitShapes(id));

  function bindWhisper(node, w) {
    node.addEventListener('click', e => {

  /* ======================================================================
     Entering the garden

  async function enterGarden() {
    if (S.screen !== 'welcome') return;
    S.screen = 'entering';
    Music.start(); syncMute();

  /* ======================================================================
     Spotlight: the tapped flower lifts into the middle of the screen
     ====================================================================== */
  function spotlightGeometry(plant) {
    const r = plant.getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
    const land = matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
    const Hs = Math.min(vh * (land ? .74 : .4), vw * (land ? .5 : .95), 400), k = Hs / r.height;
    const tx = land ? vw * .27 : vw / 2, topY = land ? (vh - Hs) / 2 : Math.max(78, vh * .12);
    return { dx: tx - (r.left + r.width / 2), dy: topY + Hs - r.bottom, k, headX: tx, headY: topY + Hs * .303 };
  }
  async function lift(plant) {
    const g = spotlightGeometry(plant);
    document.body.classList.add('spotlight'); el.scrim.classList.add('on');
    plant.classList.add('spot');
    plant.style.transform = `translate(${g.dx}px, ${g.dy}px) scale(${g.k})`;
    await wait(950);
    return g;
  }
  async function drop(plant) {
    el.scrim.classList.remove('on'); document.body.classList.remove('spotlight');
    plant.style.transform = '';
    await wait(950);
    plant.classList.remove('spot');
  }

  async function onPlant(id) {
    if (S.busy || (S.screen !== 'garden' && S.screen !== 'secret')) return;
    if (id === 'heart') return secretChallenge();
    S.busy = true;
    const plant = plants[id], f = DATA[id], idx = IDS.indexOf(id), first = !S.collected.has(id);
    Music.pop();
    const g = await lift(plant);
    if (!plant.classList.contains('open')) {
      plant.classList.add('open');
      Music.chime(idx);
      FX.bloom(id, g.headX, g.headY);
      await wait(1800);
    }
    const n = first ? S.collected.size + 1 : S.order[id];
    await showCard({
      kicker: `Reason ${n} of ${TOTAL}`, title: f.name, text: f.message, icon: Art.icon(id),
      actions: [{ label: first ? C.keepButton : C.closeButton, value: 'ok' }]
    });
    hideCard();
    if (first) collect(id, g);   // runs while the flower settles back into the garden
    await drop(plant);
    S.busy = false;
    if (first && S.collected.size === TOTAL) { await wait(500); unlockSecret(); }
  }

  /* ======================================================================
     Collecting
     ====================================================================== */
  function flyToSlot(id, x0, y0) {
    return new Promise(resolve => {
      const slot = $(`.slot[data-id="${id}"]`), sr = slot.getBoundingClientRect();
      const x1 = sr.left + sr.width / 2, y1 = sr.top + sr.height / 2;
      const f = document.createElement('div'); f.className = 'fly'; f.style.zIndex = 80; f.innerHTML = Art.icon(id); document.body.appendChild(f);
      const cx = (x0 + x1) / 2 + (x0 > innerWidth / 2 ? 90 : -90), cy = Math.min(y0, y1) - 110;
      const t0 = performance.now(), dur = 1250;
      (function step(now) {
        const u = Math.min(1, (now - t0) / dur), e = u * u * (3 - 2 * u), v = 1 - e;
        const x = v * v * x0 + 2 * v * e * cx + e * e * x1, y = v * v * y0 + 2 * v * e * cy + e * e * y1;
        f.style.transform = `translate(${x}px,${y}px) scale(${1.25 - e * 1.0}) rotate(${e * 360}deg)`;
        FX.trail(x, y);
        if (u < 1) requestAnimationFrame(step); else { f.remove(); resolve({ x: x1, y: y1, slot }); }
      })(t0);
    });
  }

  async function collect(id, g) {

    setProgress(n);
    if (n < TOTAL) setHint(C.hints.more(TOTAL - n));
    if (n === 1) setTimeout(() => toast(C.firstSecretToast, 6000), 900);
  }
