<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>A Garden Full of Reasons I Love You</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Quicksand:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="welcome">

<!-- gradients and flower symbols are injected here by art.js -->
<svg id="defs" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"></svg>

<!-- ============ the dreamy backdrop ============ -->
<div id="sky" aria-hidden="false">
  <div class="sky-day"></div>
  <div class="sky-dusk"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="clouds" id="clouds"></div>
</div>

<div id="hills" aria-hidden="true">
  <svg class="hill far" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><linearGradient id="hg-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c8f1"/><stop offset="1" stop-color="#efe2f8"/></linearGradient></defs>
    <path d="M0 34C14 14 28 18 44 28S74 8 100 24V100H0Z" fill="url(#hg-far)"/>
  </svg>
  <svg class="hill mid" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><linearGradient id="hg-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2ecd9"/><stop offset="1" stop-color="#b9e0c5"/></linearGradient></defs>
    <path d="M0 26C18 8 36 16 52 20S86 6 100 18V100H0Z" fill="url(#hg-mid)"/>
  </svg>
  <svg class="hill near" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><linearGradient id="hg-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3e8cc"/><stop offset="1" stop-color="#9dd2ae"/></linearGradient></defs>
    <path d="M0 22C20 6 40 14 58 12S88 2 100 14V100H0Z" fill="url(#hg-near)"/>
  </svg>
</div>
<div id="tint" aria-hidden="true"></div>
<div id="meadow" aria-hidden="true"></div>
<canvas id="fx-bg" aria-hidden="true"></canvas>

<!-- the garden: seven flowers, the heart flower and a few hidden whispers -->
<main id="stage" aria-label="The garden"></main>

<canvas id="fx-fg" aria-hidden="true"></canvas>

<!-- ============ 1. welcome ============ -->
<section id="welcome" class="screen">
  <div class="branch" id="branch" aria-hidden="true"></div>
  <div class="welcome-flowers" id="welcomeFlowers" aria-hidden="true"></div>
  <div class="welcome-main">
    <p class="eyebrow"><span>A Garden Full of</span> <span>Reasons I Love You</span></p>
    <h1 class="hero"><span class="hey">Hey, beautiful</span> <span class="lola"><span class="lola-name">Lola</span> <span class="lola-emoji">🌷</span></span></h1>
    <p class="sub">Someone has something special to show you…</p>
    <button id="enterBtn" class="btn btn-big" type="button">Enter My Garden 💗</button>
  </div>
  <p class="made">Made with love by Mohamed.</p>
</section>

<!-- ============ HUD ============ -->
<header id="hud" aria-label="Garden progress">
  <div class="hud-col">
    <div class="counter glass" id="counter" role="status" aria-live="polite">
      <div class="slots" id="slots" aria-hidden="true"></div>
      <span class="count"><span class="sr">Flowers collected: </span><b id="countNum">0</b>/7</span>
    </div>
    <div class="chip glass" id="whisperChip" title="Hidden whispers"><span aria-hidden="true">✧</span> <span class="sr">Hidden whispers found: </span><b id="whisperNum">0</b>/8</div>
  </div>
</header>

<button id="muteBtn" class="glass" type="button" aria-pressed="true" aria-label="Turn music on">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path class="spk" d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/>
    <path class="wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<p id="hint" aria-live="polite"></p>

<!-- ============ shared overlays ============ -->
<div id="scrim"></div>

<div id="card" class="card glass" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card-icon" id="cardIcon" aria-hidden="true"></div>
  <p class="card-kicker" id="cardKicker"></p>
  <h2 class="card-title" id="cardTitle"></h2>
  <p class="card-text" id="cardText"></p>
  <div class="card-actions" id="cardActions"></div>
</div>

<div id="toast" aria-live="polite"></div>

<!-- ============ final surprise ============ -->
<section id="finale" aria-label="The final surprise"></section>

<section id="letter" aria-hidden="true" role="dialog" aria-label="A letter for Lola">
  <div class="paper">
    <div class="corner c1" id="corner1" aria-hidden="true"></div>
    <div class="corner c2" id="corner2" aria-hidden="true"></div>
    <div class="paper-scroll" id="paperScroll">
      <div class="paper-inner">
        <p class="l-greeting" id="lGreeting"></p>
        <div class="l-body" id="lBody"></div>
        <p class="l-closing" id="lClosing"></p>
        <p class="l-sign" id="lSign"></p>
        <div class="l-next"><button class="btn" id="letterNext" type="button"></button></div>
      </div>
    </div>
    <button class="skip" id="letterSkip" type="button"></button>
  </div>
</section>

<noscript><p style="position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;text-align:center;background:#fff8f1;color:#54345c;font:italic 500 1.4rem/1.4 Georgia,serif">Hey, beautiful Lola 🌷<br>This little garden needs JavaScript to bloom. Please turn it on and come back.</p></noscript>

<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
