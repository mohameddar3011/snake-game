<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Floor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #0b0714;
    color: #f0f0f0;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 960 / 540;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(180, 80, 255, 0.35);
  }
  .controls { display: flex; gap: 10px; margin-top: 14px; }
  button {
    padding: 8px 16px;
    font: 600 14px "Segoe UI", Arial, sans-serif;
    color: #f0f0f0;
    background: #21182f;
    border: 2px solid #b45cff;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #2d2040; }
  button.on { background: #b45cff; color: #12091f; }
  .note { margin: 10px 0 0; font-size: 12px; color: #8b8fa3; text-align: center; }
</style>
</head>
<body>
  <canvas id="stage" width="960" height="540" aria-label="Cartoon dancers on a lit dance floor"></canvas>
  <div class="controls">
    <button id="playBtn">Pause</button>
    <button id="soundBtn">Sound: off</button>
  </div>
  <p class="note">Stylized cartoon, not real footage. Space pauses.</p>

<script>
const W = 960, H = 540;
const FLOOR = 468;          // y of the soles of the shoes
const BPM = 124;
const BEAT = 60 / BPM;      // seconds per beat
const S = 1.25;             // dancer scale
const SHOE = 6;             // half-height of a shoe, so soles touch the floor

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// ---------------------------------------------------------------- skeleton
// Segment lengths in unscaled units. Angles are measured from "straight
// down", positive toward screen-right; a child limb's angle is relative to
// its parent's.
const LEN = { torso: 56, thigh: 38, shin: 36, upper: 30, fore: 28, head: 18 };

function walk(p, angle, len) {
  return { x: p.x + Math.sin(angle) * len, y: p.y + Math.cos(angle) * len };
}

function skeleton(pose) {
  const hip = { x: 0, y: 0 };
  const neck = {
    x: Math.sin(pose.lean) * LEN.torso,
    y: -Math.cos(pose.lean) * LEN.torso,
  };
  const rx = Math.cos(pose.lean), ry = Math.sin(pose.lean);
  const shoulderL = { x: neck.x - rx * 11, y: neck.y - ry * 11 };
  const shoulderR = { x: neck.x + rx * 11, y: neck.y + ry * 11 };
  const hipL = { x: -8, y: 0 };
  const hipR = { x: 8, y: 0 };

  const leg = (h, [a, b]) => {
    const knee = walk(h, a, LEN.thigh);
    return { hip: h, knee, foot: walk(knee, a + b, LEN.shin) };
  };
  const arm = (s, [a, b]) => {
    const elbow = walk(s, a, LEN.upper);
    return { shoulder: s, elbow, hand: walk(elbow, a + b, LEN.fore) };
  };

  const headAngle = pose.lean + pose.tilt;
  return {
    hip, neck, headAngle,
    head: {
      x: neck.x + Math.sin(headAngle) * (LEN.head + 6),
      y: neck.y - Math.cos(headAngle) * (LEN.head + 6),
    },
    legL: leg(hipL, pose.legL),
    legR: leg(hipR, pose.legR),
    armL: arm(shoulderL, pose.armL),
    armR: arm(shoulderR, pose.armR),
  };
}

// ------------------------------------------------------------------ moves
// Each move maps a beat count (continuous) to a pose.

// Lezginka-style: arms spread like wings, quick hops, alternating knee lifts.
function lezginka(b) {
  const f = Math.abs(Math.sin(Math.PI * b));   // 0 on landing, 1 in the air
  const sw = Math.cos(Math.PI * b);            // flips sign every beat
  const odd = Math.floor(b) % 2;
  const tuckL = odd ? 0 : f;
  const tuckR = odd ? f : 0;
  return {
    jump: 16 * f,
    lean: 0.06 * sw,
    tilt: 0.12 * sw,
    legL: [-(0.3 - 0.1 * f) - 0.25 * tuckL, 0.5 * (1 - f) + 1.3 * tuckL],
    legR: [0.3 - 0.1 * f + 0.25 * tuckR, -(0.5 * (1 - f) + 1.3 * tuckR)],
    armL: [-(1.55 + 0.5 * sw), -(0.5 + 0.3 * sw)],
    armR: [1.55 - 0.5 * sw, 0.5 - 0.3 * sw],
  };
}

// Wide-stance swagger with alternating fist pumps.
function pump(b) {
  const p = 2 * Math.PI * b;
  const sw = Math.cos(Math.PI * b);
  const bend = 0.5 + 0.5 * Math.cos(p);
  const u = 0.5 + 0.5 * Math.sin(p);
  const v = 0.5 + 0.5 * Math.sin(p + Math.PI);
  return {
    jump: 0,
    lean: 0.14 * sw,
    tilt: -0.1 * sw,
    legL: [-0.42, 0.1 + 0.55 * bend],
    legR: [0.42, -(0.1 + 0.55 * bend)],
    armL: [-(0.9 + 0.5 * u), -1.8],
    armR: [0.9 + 0.5 * v, 1.8],
  };
}

// Big hops, hands sweeping overhead to meet at the top.
function hop(b) {
  const f = Math.abs(Math.sin(Math.PI * b));
  const sw = Math.cos(Math.PI * b);
  const knee = 0.3 * (1 - f) + 0.7 * f;
  return {
    jump: 22 * f,
    lean: 0.05 * sw,
    tilt: 0.12 * Math.sin(2 * Math.PI * b),
    legL: [-0.14, knee],
    legR: [0.14, -knee],
    armL: [-(0.5 + 2.4 * f), -(0.2 * (1 - f) + 0.15)],
    armR: [0.5 + 2.4 * f, 0.2 * (1 - f) + 0.15],
  };
}

const POSE_DEFAULTS = {
  jump: 0, lean: 0, tilt: 0,
  legL: [-0.12, 0.12], legR: [0.12, -0.12],
  armL: [-0.2, 0.1], armR: [0.2, -0.1],
};

const dancers = [
  {
    name: "ISLAM", x: 230, move: lezginka, glow: "#3fb950",
    skin: "#d9a27a", shirt: "#f4f4f4", sleeve: 0.55, pants: "#1d2a44",
    shoes: "#f4f4f4", hat: "papakha", beard: "#2a1a12",
  },
  {
    name: "KHAMZAT", x: 480, move: pump, glow: "#ff4d6d",
    skin: "#d6a07a", shirt: "#16181d", sleeve: 0.55, pants: "#46513c",
    shoes: "#e8e8e8", hat: "buzz", beard: "#20150f", wolf: true,
  },
  {
    name: "HASBULLA", x: 730, move: hop, glow: "#ffd23f",
    skin: "#e4b48e", shirt: "#d62839", sleeve: 1.2, pants: "#d62839",
    shoes: "#ffffff", hat: "cap", shades: true, zip: true,
  },
];

// ---------------------------------------------------------------- drawing
function limb(pts, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

const lerpPt = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

function drawDancer(d, b, idx) {
  const pose = { ...POSE_DEFAULTS, ...d.move(b) };
  const k = skeleton(pose);

  // Keep the lowest foot on the floor, then lift by the jump height.
  const lowest = Math.max(k.legL.foot.y, k.legR.foot.y);
  const oy = FLOOR - SHOE - lowest * S - pose.jump;
  const P = (p) => ({ x: d.x + p.x * S, y: oy + p.y * S });

  // Shadow shrinks as the dancer leaves the ground.
  const air = 1 - pose.jump / 90;
  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  ctx.beginPath();
  ctx.ellipse(d.x, FLOOR + 2, 48 * air, 9 * air, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs and shoes.
  for (const [leg, side] of [[k.legL, -1], [k.legR, 1]]) {
    limb([P(leg.hip), P(leg.knee), P(leg.foot)], d.pants, 15 * S);
    const f = P(leg.foot);
    ctx.fillStyle = d.shoes;
    ctx.beginPath();
    ctx.ellipse(f.x + side * 3, f.y + 2, 10 * S, 5.5 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(f.x + side * 3 - 10 * S, f.y + 2 + 3.2 * S, 20 * S, 1.6);
  }

  // Torso.
  const hipMid = P({ x: 0, y: 0 }), neck = P(k.neck);
  limb([lerpPt(hipMid, neck, 0.12), neck], d.shirt, 30 * S);
  if (d.zip) limb([lerpPt(neck, hipMid, 0.05), lerpPt(neck, hipMid, 0.85)], "#ffffff", 2);
  if (d.wolf) drawWolf(lerpPt(neck, hipMid, 0.38));

  // Arms: bare skin with a sleeve over the top.
  for (const arm of [k.armL, k.armR]) {
    const s = P(arm.shoulder), e = P(arm.elbow), h = P(arm.hand);
    limb([s, e, h], d.skin, 9.5 * S);
    if (d.sleeve >= 1) limb([s, e, lerpPt(e, h, 0.85)], d.shirt, 12 * S);
    else limb([s, lerpPt(s, e, d.sleeve)], d.shirt, 12 * S);
    ctx.fillStyle = d.skin;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 5.5 * S, 0, Math.PI * 2);
    ctx.fill();
  }

  drawHead(d, P(k.head), k.headAngle, b);
}

function drawWolf(c) {
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(c.x, c.y + 2, 7, 0, Math.PI * 2);
  ctx.fill();
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(c.x + s * 2, c.y - 3);
    ctx.lineTo(c.x + s * 8, c.y - 12);
    ctx.lineTo(c.x + s * 8.5, c.y - 1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "#16181d";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(c.x + s * 3, c.y + 1, 1.1, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHead(d, c, angle, b) {
  const R = LEN.head * S;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(angle);

  // Face and ears.
  ctx.fillStyle = d.skin;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * R, 0.1 * R, 0.25 * R, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();

  if (d.beard) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = d.beard;
    ctx.beginPath();
    ctx.ellipse(0, 0.95 * R, 1.15 * R, 0.82 * R, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Headwear.
  if (d.hat === "papakha") {
    // Tall, flat-topped fur hat with a shaggy rim.
    ctx.fillStyle = "#1d1714";
    ctx.beginPath();
    ctx.roundRect(-1.0 * R, -1.65 * R, 2.0 * R, 1.3 * R, 0.3 * R);
    ctx.fill();
    // Shaggy fur: bumps along the rim, the sides and the crown.
    for (let i = 0; i < 9; i++) {
      const x = -1.0 * R + (i / 8) * 2.0 * R;
      ctx.beginPath();
      ctx.arc(x, -0.42 * R, 0.2 * R, 0, Math.PI * 2);
      ctx.arc(x, -1.7 * R, 0.24 * R, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const s of [-1, 1]) {
      for (const y of [-0.8, -1.2]) {
        ctx.beginPath();
        ctx.arc(s * 1.02 * R, y * R, 0.2 * R, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const x = -0.8 * R + i * 0.27 * R;
      ctx.moveTo(x, -1.55 * R);
      ctx.lineTo(x + 0.08 * R, -1.2 * R);
      ctx.moveTo(x - 0.1 * R, -1.0 * R);
      ctx.lineTo(x - 0.05 * R, -0.65 * R);
    }
    ctx.stroke();
  } else if (d.hat === "buzz" || d.hat === "cap") {
    ctx.fillStyle = d.hat === "cap" ? "#0f0f12" : "#1b1b1b";
    ctx.beginPath();
    ctx.moveTo(-0.98 * R, -0.1 * R);
    ctx.arc(0, 0, R + 0.5, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(0, -0.62 * R, -0.98 * R, -0.1 * R);
    ctx.fill();
    if (d.hat === "cap") {
      ctx.beginPath();
      ctx.ellipse(0, -0.42 * R, 1.25 * R, 0.2 * R, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Eyes (or shades).
  if (d.shades) {
    ctx.fillStyle = "#0b0b0b";
    for (const x of [-0.8 * R, 0.08 * R]) {
      ctx.beginPath();
      ctx.roundRect(x, -0.2 * R, 0.72 * R, 0.42 * R, 0.12 * R);
      ctx.fill();
    }
    ctx.fillRect(-0.1 * R, -0.12 * R, 0.2 * R, 0.07 * R);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(-0.62 * R, -0.12 * R, 0.22 * R, 0.05 * R);
  } else {
    for (const s of [-1, 1]) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s * 0.38 * R, 0.02 * R, 0.17 * R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#14110f";
      ctx.beginPath();
      ctx.arc(s * 0.38 * R, 0.04 * R, 0.09 * R, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Mouth: a smile that opens wide on the beat.
  const open = 0.5 + 0.5 * Math.cos(2 * Math.PI * b);
  ctx.fillStyle = "#6e1a28";
  ctx.beginPath();
  ctx.ellipse(0, 0.5 * R, 0.34 * R, (0.07 + 0.2 * open) * R, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.ellipse(0, 0.5 * R - (0.07 + 0.2 * open) * R * 0.5, 0.28 * R, (0.07 + 0.2 * open) * R * 0.45, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ------------------------------------------------------------------ stage
const VANISH = { x: W / 2, y: 250 };
const FLOOR_TOP = 392;

function drawBackground(t, b, punch) {
  const g = ctx.createLinearGradient(0, 0, 0, FLOOR_TOP);
  g.addColorStop(0, "#0d0620");
  g.addColorStop(1, "#2b0f4d");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Equalizer bars along the back wall.
  const bars = 48;
  for (let i = 0; i < bars; i++) {
    const h = (0.25 + 0.75 * Math.abs(Math.sin(i * 1.7 + t * 3.1))) * (0.45 + 0.55 * punch) * 190;
    ctx.fillStyle = `hsla(${(i / bars) * 300 + t * 30}, 85%, 60%, 0.22)`;
    ctx.fillRect(i * (W / bars) + 2, FLOOR_TOP - h, W / bars - 4, h);
  }

  // Light spots thrown by the disco ball.
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 12; i++) {
    const a = t * 0.8 + (i / 12) * Math.PI * 2;
    const x = W / 2 + Math.cos(a) * 400;
    const y = 160 + Math.sin(a * 1.3) * 80;
    ctx.fillStyle = `hsla(${(i * 40 + t * 40) % 360}, 90%, 60%, 0.28)`;
    ctx.beginPath();
    ctx.arc(x, y, 15 + 5 * punch, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawFloor(t, b, punch) {
  const rows = 7, cols = 16;
  const rowY = (k) => FLOOR_TOP + (H - FLOOR_TOP) * Math.pow(k / rows, 1.5);
  const colX = (i, y) => W / 2 + (i - cols / 2) * 150 * ((y - VANISH.y) / (H - VANISH.y));

  ctx.fillStyle = "#14082a";
  ctx.fillRect(0, FLOOR_TOP, W, H - FLOOR_TOP);

  for (let k = 0; k < rows; k++) {
    for (let i = 0; i < cols; i++) {
      const y0 = rowY(k), y1 = rowY(k + 1);
      const lit = Math.sin(i * 0.9 + k * 1.3 + b * Math.PI);
      if (lit > 0.55) {
        ctx.fillStyle = `hsla(${(i * 25 + k * 40 + t * 60) % 360}, 85%, 55%, ${0.18 + 0.25 * punch})`;
        ctx.beginPath();
        ctx.moveTo(colX(i, y0), y0);
        ctx.lineTo(colX(i + 1, y0), y0);
        ctx.lineTo(colX(i + 1, y1), y1);
        ctx.lineTo(colX(i, y1), y1);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  ctx.strokeStyle = "rgba(180, 92, 255, 0.35)";
  ctx.lineWidth = 1;
  for (let k = 0; k <= rows; k++) {
    ctx.beginPath();
    ctx.moveTo(0, rowY(k));
    ctx.lineTo(W, rowY(k));
    ctx.stroke();
  }
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(colX(i, FLOOR_TOP), FLOOR_TOP);
    ctx.lineTo(colX(i, H), H);
    ctx.stroke();
  }
}

function drawSpotlights(t, punch) {
  ctx.globalCompositeOperation = "lighter";
  dancers.forEach((d, i) => {
    const sx = d.x + 110 * Math.sin(t * 0.7 + i * 2);
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR);
    g.addColorStop(0, hexA(d.glow, 0.5));
    g.addColorStop(1, hexA(d.glow, 0.04 + 0.06 * punch));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - 8, 0);
    ctx.lineTo(sx + 8, 0);
    ctx.lineTo(d.x + 105, FLOOR);
    ctx.lineTo(d.x - 105, FLOOR);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = hexA(d.glow, 0.18 + 0.15 * punch);
    ctx.beginPath();
    ctx.ellipse(d.x, FLOOR, 120, 20, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over";
}

function drawDiscoBall(t) {
  const cx = W / 2, cy = 34, r = 24;
  ctx.strokeStyle = "#8a8fa8";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, cy - r);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  const g = ctx.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, r);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(1, "#6b7088");
  ctx.fillStyle = g;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.strokeStyle = "rgba(20,20,40,0.45)";
  ctx.lineWidth = 1;
  for (let j = 0; j < 8; j++) {
    const x = cx + r * Math.sin(j * (Math.PI / 4) + t * 1.2);
    ctx.beginPath();
    ctx.moveTo(x, cy - r);
    ctx.lineTo(x, cy + r);
    ctx.stroke();
  }
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + k * 7);
    ctx.lineTo(cx + r, cy + k * 7);
    ctx.stroke();
  }
  ctx.restore();

  // Sparkle.
  const s = 0.5 + 0.5 * Math.sin(t * 6);
  ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.6 * s})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 9, cy - 9 - 6 * s); ctx.lineTo(cx - 9, cy - 9 + 6 * s);
  ctx.moveTo(cx - 9 - 6 * s, cy - 9); ctx.lineTo(cx - 9 + 6 * s, cy - 9);
  ctx.stroke();
}

function drawNames(punch) {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "800 32px 'Segoe UI', Arial, sans-serif";
  for (const d of dancers) {
    ctx.save();
    ctx.shadowColor = d.glow;
    ctx.shadowBlur = 10 + 22 * punch;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(d.name, d.x, 118);
    ctx.shadowBlur = 0;
    ctx.fillStyle = d.glow;
    ctx.fillRect(d.x - 28, 142, 56, 3);
    ctx.restore();
  }
}

// Confetti is a pure function of time, so a frame can be rendered at any t.
const CONFETTI = Array.from({ length: 70 }, (_, i) => {
  const r = (n) => { const x = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
  return { x: r(1) * W, y: r(2) * (H + 40), speed: 40 + r(3) * 70, drift: 10 + r(4) * 25, hue: Math.floor(r(5) * 360), size: 4 + r(6) * 5, spin: 2 + r(7) * 4 };
});

function drawConfetti(t) {
  for (const c of CONFETTI) {
    const y = (c.y + t * c.speed) % (H + 40) - 20;
    const x = c.x + Math.sin(t * 1.5 + c.y) * c.drift;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * c.spin);
    ctx.scale(1, Math.cos(t * c.spin * 1.3));
    ctx.fillStyle = `hsl(${c.hue}, 90%, 62%)`;
    ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.restore();
  }
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

// Render one frame at dance-clock time t (seconds).
function render(t) {
  const b = t / BEAT;
  const punch = Math.exp(-4 * (b % 1));         // 1 on the beat, fading out
  ctx.clearRect(0, 0, W, H);
  drawBackground(t, b, punch);
  drawFloor(t, b, punch);
  drawSpotlights(t, punch);
  drawDiscoBall(t);
  drawNames(punch);
  dancers.forEach((d, i) => drawDancer(d, b, i));
  drawConfetti(t);

  // Brief white flash on the first beat of every bar.
  const bar = Math.exp(-6 * ((b / 4) % 1)) * 0.12;
  if (bar > 0.005) {
    ctx.fillStyle = `rgba(255,255,255,${bar})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ------------------------------------------------------------------ clock
const reducedMotion =
  window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let paused = reducedMotion;
let elapsed = 0;                 // dance time accumulated before the last resume
let resumedAt = performance.now();

function clock() {
  return elapsed + (paused ? 0 : (performance.now() - resumedAt) / 1000);
}

function setPaused(p) {
  if (p === paused) return;
  if (p) elapsed = clock();
  else resumedAt = performance.now();
  paused = p;
  playBtn.textContent = paused ? "Play" : "Pause";
  if (!paused) resyncAudio();
  if (paused) render(clock());
}

function frame() {
  if (!paused) render(clock());
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ sound
// A small synthesized house loop. Notes are scheduled against the dance
// clock, so the music stays locked to the dancers.
const STEP = BEAT / 4;           // sixteenth note
const BASS = [55, 0, 55, 82.4, 0, 55, 73.4, 0, 65.4, 0, 65.4, 98, 0, 65.4, 87.3, 0];
const LEAD = [440, 0, 523, 0, 659, 0, 523, 0, 440, 0, 587, 0, 659, 0, 784, 0];
let actx = null, noiseBuf = null, soundOn = false, nextStep = 0;

function resyncAudio() { nextStep = Math.ceil(clock() / STEP); }

function tone(type, freq, when, dur, gain, filterHz) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  let node = o;
  if (filterHz) {
    const f = actx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = filterHz;
    o.connect(f);
    node = f;
  }
  node.connect(g);
  g.connect(actx.destination);
  g.gain.setValueAtTime(gain, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + dur);
  o.start(when);
  o.stop(when + dur + 0.02);
}

function noise(when, dur, gain, filterType, hz) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf;
  f.type = filterType;
  f.frequency.value = hz;
  s.connect(f); f.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(gain, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + dur);
  s.start(when);
  s.stop(when + dur + 0.02);
}

function playStep(n, when) {
  const s = n % 16;
  if (s % 4 === 0) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(150, when);
    o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.9, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.22);
    o.start(when); o.stop(when + 0.25);
  }
  if (s === 4 || s === 12) noise(when, 0.15, 0.35, "bandpass", 1600);
  if (s % 4 === 2) noise(when, 0.05, 0.14, "highpass", 7000);
  if (BASS[s]) tone("sawtooth", BASS[s], when, 0.2, 0.22, 420);
  if (LEAD[s]) tone("triangle", LEAD[s], when, 0.16, 0.07);
}

setInterval(() => {
  if (!soundOn || paused) return;
  const now = clock();
  while (nextStep * STEP < now + 0.15) {
    playStep(nextStep, actx.currentTime + Math.max(0, nextStep * STEP - now));
    nextStep++;
  }
}, 30);

// --------------------------------------------------------------- controls
const playBtn = document.getElementById("playBtn");
const soundBtn = document.getElementById("soundBtn");
playBtn.textContent = paused ? "Play" : "Pause";

playBtn.addEventListener("click", () => setPaused(!paused));
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  if (soundOn) {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    actx.resume();
    resyncAudio();
  }
  soundBtn.textContent = soundOn ? "Sound: on" : "Sound: off";
  soundBtn.classList.toggle("on", soundOn);
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    setPaused(!paused);
  }
});

render(clock());
requestAnimationFrame(frame);
</script>
</body>
</html>
