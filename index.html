<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Snake</h1>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>High Score: <span id="highScore">0</span></div>
      <div>Level: <span id="level">1</span></div>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <button id="aiToggle">AI Autopilot: OFF</button>
    <p id="message">Press an arrow key or WASD to start. Press P to pause, I for AI autopilot.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
